<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>관리자 - 주문 관리 시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
</head>
<body class="text-slate-800 antialiased pb-16">

    <!-- 로그인 모달 / 오버레이 화면 -->
    <div id="admin_login_screen" class="fixed inset-0 bg-slate-900 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl max-w-sm w-full p-6 space-y-5 border border-slate-100">
            <div class="text-center space-y-1">
                <div class="inline-flex bg-indigo-50 text-indigo-600 p-3 rounded-full text-xl mb-1">🔐</div>
                <h2 class="text-lg font-bold text-slate-900">관리자 보호 구역</h2>
                <p class="text-xs text-slate-500">관리자 계정 정보를 입력해주세요.</p>
            </div>

            <form onsubmit="handleAdminLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">관리자 아이디</label>
                    <input type="text" id="admin_id_input" required placeholder="아이디를 입력하세요" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">비밀번호</label>
                    <input type="password" id="admin_pw_input" required placeholder="비밀번호를 입력하세요" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>

                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl text-sm shadow-md transition duration-200">
                    로그인 및 접속
                </button>
            </form>

            <div class="text-center">
                <a href="index.html" class="text-xs text-slate-400 hover:text-slate-600 transition">← 쇼핑몰 메인으로 돌아가기</a>
            </div>
        </div>
    </div>

    <!-- 실제 관리자 대시보드 메인 -->
    <div id="admin_dashboard_content" class="hidden">
        <header class="bg-slate-900 text-white py-4 px-4 shadow-md sticky top-0 z-40">
            <div class="max-w-2xl mx-auto flex justify-between items-center">
                <h1 class="text-base font-bold">📊 관리자 대시보드 (주문 관리)</h1>
                <div class="flex items-center space-x-2">
                    <button onclick="playAlertVoice()" class="text-xs bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-lg font-medium transition">🔊 테스트 음성</button>
                    <button onclick="adminLogout()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg font-medium transition">로그아웃</button>
                </div>
            </div>
        </header>

        <main class="max-w-2xl mx-auto p-4 mt-2 space-y-4">
            <!-- 상단 통계 카드 -->
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                    <span class="text-xs text-slate-500 font-medium">총 접수 주문</span>
                    <div id="total_orders_count" class="text-2xl font-bold text-slate-900 mt-1">0건</div>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                    <span class="text-xs text-slate-500 font-medium">입금 대기 / 확인 필요</span>
                    <div id="pending_orders_count" class="text-2xl font-bold text-indigo-600 mt-1">0건</div>
                </div>
            </div>

            <div class="flex justify-between items-center mt-4">
                <h2 class="font-bold text-slate-800 text-base">📋 실시간 주문 리스트 (회원/비회원 통합)</h2>
                <div class="space-x-2">
                    <button onclick="clearOrders()" class="bg-white hover:bg-red-50 text-red-600 border border-slate-200 text-xs font-semibold px-3 py-1.5 rounded-lg transition">
                        전체 초기화
                    </button>
                </div>
            </div>

            <!-- 주문 목록 카드 영역 -->
            <div id="order_list_container" class="space-y-3">
                <!-- 주문 항목이 동적으로 삽입됩니다 -->
            </div>
            
            <div id="empty_notice" class="bg-white rounded-xl p-8 text-center border border-slate-200 text-slate-400 text-sm hidden">
                아직 접수된 주문이 없습니다. 쇼핑몰에서 주문을 진행해 보세요!
            </div>
        </main>
    </div>

    <script>
        const ADMIN_ID = 'admin';
        const ADMIN_PW = 'kwakys010%';

        let lastOrderCount = -1;

        function playAlertVoice() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance("주문 왔어요! 새로운 주문을 확인해 주세요.");
                utterance.lang = 'ko-KR';
                utterance.rate = 1.1;
                utterance.pitch = 1.2;
                window.speechSynthesis.speak(utterance);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const isSessionLogin = sessionStorage.getItem('store_admin_logged');
            const isLocalLogin = localStorage.getItem('store_admin_logged');

            if (isSessionLogin === 'true' || isLocalLogin === 'true') {
                showDashboard();
            }

            setInterval(() => {
                const dashboardContent = document.getElementById('admin_dashboard_content');
                if (dashboardContent && !dashboardContent.classList.contains('hidden')) {
                    checkNewOrders();
                }
            }, 3000);
        });

        function checkNewOrders() {
            const orders = getOrders();
            if (lastOrderCount === -1) {
                lastOrderCount = orders.length;
            } else if (orders.length > lastOrderCount) {
                playAlertVoice();
                lastOrderCount = orders.length;
                renderOrders();
            } else if (orders.length < lastOrderCount) {
                lastOrderCount = orders.length;
                renderOrders();
            }
        }

        function handleAdminLogin(event) {
            event.preventDefault();
            const inputId = document.getElementById('admin_id_input').value.trim();
            const inputPw = document.getElementById('admin_pw_input').value.trim();

            if (inputId === ADMIN_ID && inputPw === ADMIN_PW) {
                try {
                    sessionStorage.setItem('store_admin_logged', 'true');
                    localStorage.setItem('store_admin_logged', 'true');
                } catch (e) {
                    console.error('로그인 저장소 기록 실패', e);
                }
                showDashboard();
            } else {
                alert('아이디 또는 비밀번호가 올바르지 않습니다.');
                document.getElementById('admin_pw_input').value = '';
                document.getElementById('admin_pw_input').focus();
            }
        }

        function showDashboard() {
            const loginScreen = document.getElementById('admin_login_screen');
            const dashboardContent = document.getElementById('admin_dashboard_content');
            
            if (loginScreen) loginScreen.classList.add('hidden');
            if (dashboardContent) dashboardContent.classList.remove('hidden');
            
            const orders = getOrders();
            lastOrderCount = orders.length;
            renderOrders();
        }

        function adminLogout() {
            if (confirm('관리자 계정에서 로그아웃 하시겠습니까?')) {
                sessionStorage.removeItem('store_admin_logged');
                localStorage.removeItem('store_admin_logged');
                location.reload();
            }
        }

        function getOrders() {
            let orders = [];
            try {
                orders = JSON.parse(localStorage.getItem('store_orders') || '[]');
            } catch (e) {
                orders = [];
            }
            
            return orders.map(order => ({
                ...order,
                product: order.product || order.fullProductDescription || '상품 내역 없음',
                price: Number(order.price || order.totalAmount || 0),
                password: order.password || order.orderPw || '1234',
                status: order.status || '입금대기',
                isMember: order.isMember !== undefined ? order.isMember : false
            }));
        }

        function renderOrders() {
            const orders = getOrders();
            const container = document.getElementById('order_list_container');
            const emptyNotice = document.getElementById('empty_notice');
            
            document.getElementById('total_orders_count').innerText = orders.length + '건';
            document.getElementById('pending_orders_count').innerText = orders.filter(o => o.status === '입금대기').length + '건';

            if (orders.length === 0) {
                container.innerHTML = '';
                emptyNotice.classList.remove('hidden');
                return;
            }

            emptyNotice.classList.add('hidden');
            let html = '';

            orders.forEach((order, index) => {
                let statusStyle = 'bg-amber-50 text-amber-700 border-amber-200';
                if (order.status === '입금완료') {
                    statusStyle = 'bg-emerald-50 text-emerald-700 border-emerald-200';
                } else if (order.status === '배송준비') {
                    statusStyle = 'bg-blue-50 text-blue-700 border-blue-200';
                } else if (order.status === '배송중') {
                    statusStyle = 'bg-red-50 text-red-700 border-red-200';
                } else if (order.status === '배송완료') {
                    statusStyle = 'bg-slate-100 text-slate-700 border-slate-300';
                }

                const memberBadge = order.isMember === true
                    ? `<span class="bg-blue-100 text-blue-700 text-[10px] px-1.5 py-0.5 rounded font-bold ml-1">👤 회원주문</span>` 
                    : `<span class="bg-purple-100 text-purple-700 text-[10px] px-1.5 py-0.5 rounded font-bold ml-1">🛍️ 비회원주문</span>`;

                html += `
                    <div class="bg-white rounded-xl shadow-sm p-4 border border-slate-200 space-y-3">
                        <div class="flex justify-between items-start border-b border-slate-100 pb-2">
                            <div>
                                <span class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded">${order.orderId}</span>
                                ${memberBadge}
                                <span class="text-xs text-slate-400 ml-2">${order.date}</span>
                            </div>
                            <div>
                                <select onchange="updateStatus(${index}, this.value)" class="text-xs font-bold p-1 rounded border ${statusStyle}">
                                    <option value="입금대기" ${order.status === '입금대기' ? 'selected' : ''}>⏳ 입금대기</option>
                                    <option value="입금완료" ${order.status === '입금완료' ? 'selected' : ''}>✅ 입금완료</option>
                                    <option value="배송준비" ${order.status === '배송준비' ? 'selected' : ''}>📦 배송준비</option>
                                    <option value="배송중" ${order.status === '배송중' ? 'selected' : ''}>🚚 배송중</option>
                                    <option value="배송완료" ${order.status === '배송완료' ? 'selected' : ''}>📦 배송완료</option>
                                </select>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-2 text-sm">
                            <div class="col-span-2">
                                <span class="text-xs text-slate-400 block">주문 상품 내역</span>
                                <span class="font-bold text-slate-800 text-xs sm:text-sm">${order.product}</span>
                            </div>
                            <div class="col-span-2 flex justify-between items-center border-t border-slate-100 pt-2 mt-1">
                                <span class="text-xs text-slate-400">총 결제 금액</span>
                                <span class="font-bold text-emerald-600 text-base">${Number(order.price || 0).toLocaleString()}원</span>
                            </div>
                        </div>

                        <div class="bg-slate-50 rounded-lg p-3 space-y-1 text-xs text-slate-600 border border-slate-100">
                            <div><strong class="text-slate-700">주문자:</strong> ${order.name} (${order.phone})</div>
                            <div><strong class="text-slate-700">입금자명:</strong> <span class="text-red-500 font-bold">${order.depositor}</span></div>
                            <div class="flex items-center justify-between">
                                <div><strong class="text-slate-700">조회 비밀번호:</strong> <span class="font-mono bg-slate-200 px-1.5 py-0.5 rounded text-slate-800 font-bold">${order.password || '1234'}</span></div>
                                <button onclick="changeOrderPassword(${index})" class="text-[11px] bg-indigo-50 text-indigo-600 hover:bg-indigo-100 px-2 py-0.5 rounded font-bold transition">비밀번호 변경</button>
                            </div>
                            <div><strong class="text-slate-700">배송주소:</strong> ${order.address}</div>
                            ${order.memo ? `<div><strong class="text-slate-700">요청사항:</strong> ${order.memo}</div>` : ''}
                        </div>

                        <div class="flex justify-end space-x-2 pt-1">
                            <button onclick="deleteOrder(${index})" class="text-xs text-slate-400 hover:text-red-600 px-2 py-1 transition">삭제하기</button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function changeOrderPassword(index) {
            let orders = getOrders();
            if (!orders[index]) return;

            const newPw = prompt('변경할 새로운 조회 비밀번호를 입력해주세요 (예: 4자리 숫자):', orders[index].password);
            if (newPw !== null) {
                const trimmedPw = newPw.trim();
                if (trimmedPw === '') {
                    alert('비밀번호를 공백으로 지정할 수 없습니다.');
                    return;
                }
                orders[index].password = trimmedPw;
                localStorage.setItem('store_orders', JSON.stringify(orders));
                alert('주문 조회 비밀번호가 성공적으로 변경되었습니다.');
                renderOrders();
            }
        }

        function updateStatus(index, newStatus) {
            let orders = getOrders();
            if(orders[index]) {
                orders[index].status = newStatus;
                localStorage.setItem('store_orders', JSON.stringify(orders));
                renderOrders();
            }
        }

        function deleteOrder(index) {
            if (confirm('해당 주문 내역을 삭제하시겠습니까?')) {
                let orders = getOrders();
                orders.splice(index, 1);
                localStorage.setItem('store_orders', JSON.stringify(orders));
                renderOrders();
            }
        }

        function clearOrders() {
            if (confirm('모든 주문 내역을 초기화하시겠습니까?')) {
                localStorage.removeItem('store_orders');
                renderOrders();
            }
        }
    </script>
</body>
</html>
