<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>관리자 - 주문 관리 시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
</head>
<body class="text-slate-800 antialiased pb-16">
    <header class="bg-slate-900 text-white py-4 px-4 shadow-md sticky top-0 z-50">
        <div class="max-w-2xl mx-auto flex justify-between items-center">
            <h1 class="text-base font-bold">📊 연상네트웍스 관리자 대시보드</h1>
            <a href="index.html" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg font-medium transition">스토어로 가기</a>
        </div>
    </header>

    <main class="max-w-2xl mx-auto p-4 mt-2 space-y-4">
        <!-- 상단 통계 카드 -->
        <div class="grid grid-cols-2 gap-3">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <span class="text-xs text-slate-500 font-medium">총 접수 주문</span>
                <div id="total_orders_count" class="text-2xl font-bold text-slate-900 mt-1">0건</div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <span class="text-xs text-slate-500 font-medium">입금 대기 / 확인 필요</span>
                <div id="pending_orders_count" class="text-2xl font-bold text-indigo-600 mt-1">0건</div>
            </div>
        </div>

        <div class="flex justify-between items-center mt-4">
            <h2 class="font-bold text-slate-800 text-base">📋 실시간 주문 리스트</h2>
            <div class="space-x-2">
                <button onclick="addSampleOrder()" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-600 border border-indigo-200 text-xs font-semibold px-3 py-1.5 rounded-lg transition">
                    + 샘플 주문 추가 테스트
                </button>
                <button onclick="clearOrders()" class="bg-white hover:bg-red-50 text-red-600 border border-slate-200 text-xs font-semibold px-3 py-1.5 rounded-lg transition">
                    전체 초기화
                </button>
            </div>
        </div>

        <!-- 주문 목록 테이블 / 카드 영역 -->
        <div id="order_list_container" class="space-y-3">
            <!-- 주문 항목이 동적으로 삽입됩니다 -->
        </div>
        
        <div id="empty_notice" class="bg-white rounded-xl p-8 text-center border border-slate-200 text-slate-400 text-sm hidden">
            아직 접수된 주문이 없습니다. 쇼핑몰에서 장바구니 주문을 진행해 보세요!
        </div>
    </main>

    <script>
        function getOrders() {
            let orders = [];
            try {
                orders = JSON.parse(localStorage.getItem('store_orders') || '[]');
            } catch (e) {
                orders = [];
            }
            
            if (orders.length === 0) {
                orders = [
                    {
                        orderId: 'ORD849201',
                        name: '김민준',
                        phone: '010-1234-5678',
                        address: '서울시 강남구 테헤란로 123',
                        product: '수제 프리미엄 만두 세트 (1kg) 외 1건 [택배비 3,500원 포함]',
                        price: 36500,
                        depositor: '김민준',
                        memo: '문 앞에 놔주세요',
                        password: '1234',
                        date: '2026-06-07 14:30',
                        status: '입금대기'
                    }
                ];
                localStorage.setItem('store_orders', JSON.stringify(orders));
            }

            // 최신 날짜순 정렬 보장 안전장치 추가
            orders.sort((a, b) => new Date(b.date) - new Date(a.date));
            return orders;
        }

        function renderOrders() {
            const orders = getOrders();
            const container = document.getElementById('order_list_container');
            const emptyNotice = document.getElementById('empty_notice');
            
            document.getElementById('total_orders_count').innerText = orders.length + '건';
            document.getElementById('pending_orders_count').innerText = orders.filter(o => o.status === '입금대기').length + '건';

            if (orders.length === 0) {
                container.innerHTML = '';
                emptyNotice.classList.remove('hidden');
                return;
            }

            emptyNotice.classList.add('hidden');
            let html = '';

            orders.forEach((order, index) => {
                let statusStyle = 'bg-amber-50 text-amber-700 border-amber-200';
                if (order.status === '입금완료') {
                    statusStyle = 'bg-emerald-50 text-emerald-700 border-emerald-200';
                } else if (order.status === '배송준비') {
                    statusStyle = 'bg-blue-50 text-blue-700 border-blue-200';
                } else if (order.status === '배송중') {
                    statusStyle = 'bg-red-50 text-red-700 border-red-200';
                } else if (order.status === '배송완료') {
                    statusStyle = 'bg-slate-100 text-slate-700 border-slate-300';
                }

                // 비밀번호 마스킹 처리 (관리자 화면 보안 강화)
                const maskedPw = order.password ? '**** (설정됨)' : '1234';

                html += `
                    <div class="bg-white rounded-xl shadow-sm p-4 border border-slate-200 space-y-3">
                        <div class="flex justify-between items-start border-b border-slate-100 pb-2">
                            <div>
                                <span class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded">${order.orderId}</span>
                                <span class="text-xs text-slate-400 ml-2">${order.date}</span>
                            </div>
                            <div>
                                <select onchange="updateStatus(${index}, this.value)" class="text-xs font-bold p-1 rounded border ${statusStyle}">
                                    <option value="입금대기" ${order.status === '입금대기' ? 'selected' : ''}>⏳ 입금대기</option>
                                    <option value="입금완료" ${order.status === '입금완료' ? 'selected' : ''}>✅ 입금완료(확인됨)</option>
                                    <option value="배송준비" ${order.status === '배송준비' ? 'selected' : ''}>📦 배송준비</option>
                                    <option value="배송중" ${order.status === '배송중' ? 'selected' : ''}>🚚 배송중</option>
                                    <option value="배송완료" ${order.status === '배송완료' ? 'selected' : ''}>📦 배송완료</option>
                                </select>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-2 text-sm">
                            <div class="col-span-2">
                                <span class="text-xs text-slate-400 block">주문 상품 내역</span>
                                <span class="font-bold text-slate-800 text-xs sm:text-sm">${order.product}</span>
                            </div>
                            <div class="col-span-2 flex justify-between items-center border-t border-slate-100 pt-2 mt-1">
                                <span class="text-xs text-slate-400">총 결제 금액</span>
                                <span class="font-bold text-emerald-600 text-base">${Number(order.price || 0).toLocaleString()}원</span>
                            </div>
                        </div>

                        <div class="bg-slate-50 rounded-lg p-3 space-y-1 text-xs text-slate-600 border border-slate-100">
                            <div><strong class="text-slate-700">주문자:</strong> ${order.name} (${order.phone})</div>
                            <div><strong class="text-slate-700">입금자명:</strong> <span class="text-red-500 font-bold">${order.depositor}</span></div>
                            <div class="flex justify-between items-center">
                                <span><strong class="text-slate-700">조회 비밀번호:</strong> <span class="font-mono bg-slate-200 px-1.5 py-0.5 rounded text-slate-800 font-bold">${maskedPw}</span></span>
                            </div>
                            <div><strong class="text-slate-700">배송주소:</strong> ${order.address}</div>
                            ${order.memo ? `<div><strong class="text-slate-700">요청사항:</strong> ${order.memo}</div>` : ''}
                        </div>

                        <div class="flex justify-end space-x-2 pt-1">
                            <button onclick="deleteOrder(${index})" class="text-xs text-slate-400 hover:text-red-600 px-2 py-1 transition">삭제하기</button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function updateStatus(index, newStatus) {
            let orders = getOrders();
            if(orders[index]) {
                orders[index].status = newStatus;
                localStorage.setItem('store_orders', JSON.stringify(orders));
                renderOrders();
            }
        }

        function deleteOrder(index) {
            if (confirm('해당 주문 내역을 삭제하시겠습니까?')) {
                let orders = getOrders();
                orders.splice(index, 1);
                localStorage.setItem('store_orders', JSON.stringify(orders));
                renderOrders();
            }
        }

        function clearOrders() {
            if (confirm('모든 주문 내역을 초기화하시겠습니까?')) {
                localStorage.removeItem('store_orders');
                renderOrders();
            }
        }

        function addSampleOrder() {
            let orders = getOrders();
            const sampleNames = ['박지영', '이준호', '정서연', '오민석'];
            const sampleProducts = [
                '한돈 냉동 삼겹살 구이용 (500g) 외 1건 [무료배송]',
                '오늘한끼 볶음밥 5종 골라담기 (2개) [택배비 3,500원 포함]',
                '수제 프리미엄 만두 세트 (1kg) [무료배송]'
            ];
            const randomName = sampleNames[Math.floor(Math.random() * sampleNames.length)];
            const randomProduct = sampleProducts[Math.floor(Math.random() * sampleProducts.length)];
            const randomPrice = Math.floor(Math.random() * 3) * 10000 + 25000;
            const randomPassword = String(Math.floor(1000 + Math.random() * 9000));
            
            const newOrder = {
                orderId: 'ORD' + Math.floor(100000 + Math.random() * 900000),
                name: randomName,
                phone: '010-' + Math.floor(1000 + Math.random() * 9000) + '-' + Math.floor(1000 + Math.random() * 9000),
                address: '대전광역시 서구 둔산로 ' + Math.floor(10 + Math.random() * 100),
                product: randomProduct,
                price: randomPrice,
                depositor: randomName,
                memo: '부재시 경비실에 맡겨주세요',
                password: randomPassword,
                date: new Date().toISOString().replace('T', ' ').substring(0, 16),
                status: '입금대기'
            };

            orders.unshift(newOrder);
            localStorage.setItem('store_orders', JSON.stringify(orders));
            renderOrders();
        }

        renderOrders();
    </script>
</body>
</html>
