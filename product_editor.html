<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘한끼냉동 - 상품 관리 및 구성 편집기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .toast-slide { animation: slideIn 0.3s ease, fadeOut 0.3s ease 1.7s forwards; }
        @keyframes slideIn { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
    </style>
</head>
<body class="text-slate-800 antialiased pb-20">
    <header class="bg-slate-900 text-white py-4 px-6 shadow-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <span class="text-xl">🥩</span>
                <h1 class="text-base font-bold">오늘한끼냉동 - 상품 편집 대시보드</h1>
            </div>
            <div class="space-x-2">
                <a href="index.html" target="_blank" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-2 rounded-lg font-medium transition">고객용 스토어 보기 ↗</a>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 md:p-6 space-y-6">
        <!-- 안내 박스 -->
        <div class="bg-indigo-50 border border-indigo-100 rounded-2xl p-4 text-xs text-indigo-900 leading-relaxed flex items-start space-x-3">
            <span class="text-lg">💡</span>
            <div>
                <strong class="font-bold block mb-0.5">상품 편집 및 저장 안내</strong>
                상품 정보를 수정하거나 사진을 변경한 뒤, 하단의 <strong class="text-indigo-700">[변경 사항 저장하기]</strong> 버튼을 꼭 눌러야 고객용 스토어(<code class="bg-indigo-100 px-1 py-0.5 rounded">index.html</code>)에 반영됩니다.<br>
                백업 파일명은 <code class="bg-indigo-100 px-1 py-0.5 rounded">oneul_hankki_backupfile.json</code>으로 저장됩니다.
            </div>
        </div>

        <!-- 상품 추가 / 수정 폼 카드 -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 md:p-6 space-y-4">
            <h2 id="form_title" class="font-bold text-slate-800 text-base flex items-center">
                <span>➕ 새 상품 추가하기</span>
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="hidden" id="edit_index" value="-1">
                
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">상품명 <span class="text-red-500">*</span></label>
                    <input type="text" id="p_name" placeholder="예: 오늘한끼 수제 육즙 만두 (1kg)" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">판매 가격 (원) <span class="text-red-500">*</span></label>
                    <input type="number" id="p_price" placeholder="18000" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>

                <!-- 품목별 카테고리 설정 영역 -->
                <div class="md:col-span-2 bg-slate-50 border border-slate-200 rounded-2xl p-4 space-y-3">
                    <label class="block text-xs font-bold text-slate-700">🏷️ 상품 상세 정보 카테고리 (품목별 직접 수정)</label>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-3 items-center">
                        <div class="md:col-span-3">
                            <input type="text" id="p_category" value="🥟만두류" placeholder="예: 🥟만두류" class="w-full bg-white border border-slate-300 rounded-xl p-3 text-sm font-semibold focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        </div>
                    </div>
                    <!-- 카테고리 빠른 선택 팔레트 -->
                    <div>
                        <span class="block text-[11px] font-bold text-slate-600 mb-2">✨ 품목별 카테고리 빠른 선택</span>
                        <div class="flex flex-wrap gap-1.5">
                            <button type="button" onclick="setCategory('🥟만두류')" class="flex items-center px-2.5 py-1 bg-white border border-slate-200 rounded-lg text-[11px] hover:bg-indigo-50 hover:border-indigo-200 transition font-medium">🥟만두류</button>
                            <button type="button" onclick="setCategory('🥩소고기')" class="flex items-center px-2.5 py-1 bg-white border border-slate-200 rounded-lg text-[11px] hover:bg-indigo-50 hover:border-indigo-200 transition font-medium">🥩소고기</button>
                            <button type="button" onclick="setCategory('🍳간편요리')" class="flex items-center px-2.5 py-1 bg-white border border-slate-200 rounded-lg text-[11px] hover:bg-indigo-50 hover:border-indigo-200 transition font-medium">🍳간편요리</button>
                            <button type="button" onclick="setCategory('🍗닭고기')" class="flex items-center px-2.5 py-1 bg-white border border-slate-200 rounded-lg text-[11px] hover:bg-indigo-50 hover:border-indigo-200 transition font-medium">🍗닭고기</button>
                            <button type="button" onclick="setCategory('🍖돼지고기')" class="flex items-center px-2.5 py-1 bg-white border border-slate-200 rounded-lg text-[11px] hover:bg-indigo-50 hover:border-indigo-200 transition font-medium">🍖돼지고기</button>
                            <button type="button" onclick="setCategory('🍲국/찌개')" class="flex items-center px-2.5 py-1 bg-white border border-slate-200 rounded-lg text-[11px] hover:bg-indigo-50 hover:border-indigo-200 transition font-medium">🍲국/찌개</button>
                            <button type="button" onclick="setCategory('🍎과일')" class="flex items-center px-2.5 py-1 bg-white border border-slate-200 rounded-lg text-[11px] hover:bg-indigo-50 hover:border-indigo-200 transition font-medium">🍎과일</button>
                            <button type="button" onclick="setCategory('🧊냉동')" class="flex items-center px-2.5 py-1 bg-white border border-slate-200 rounded-lg text-[11px] hover:bg-indigo-50 hover:border-indigo-200 transition font-medium">🧊냉동</button>
                            <button type="button" onclick="setCategory('❄️냉장')" class="flex items-center px-2.5 py-1 bg-white border border-slate-200 rounded-lg text-[11px] hover:bg-indigo-50 hover:border-indigo-200 transition font-medium">❄️냉장</button>
                        </div>
                    </div>
                </div>

                <!-- 상품 이미지 설정 영역 -->
                <div class="md:col-span-2 bg-slate-50 border border-slate-200 rounded-2xl p-4 space-y-3">
                    <label class="block text-xs font-bold text-slate-700">🖼️ 상품 이미지 설정 (최대 3장 사진 업로드 또는 이모지)</label>
                    
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-3 items-center">
                        <div>
                            <span class="block text-[11px] text-slate-500 mb-1">대표 이모지 아이콘</span>
                            <input type="text" id="p_img" value="🥟" class="w-full text-center bg-white border border-slate-300 rounded-xl p-2.5 text-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        </div>
                        <div class="md:col-span-2">
                            <span class="block text-[11px] text-slate-500 mb-1">내 기기에서 사진 파일 업로드 (최대 3장, 자동 압축)</span>
                            <div class="flex items-center space-x-2">
                                <label class="flex-1 cursor-pointer bg-white border border-slate-300 hover:bg-indigo-50 text-slate-700 rounded-xl px-3 py-2 text-xs font-medium text-center transition flex items-center justify-center space-x-1">
                                    <span>📁 사진 파일 선택하기 (최대 3장)</span>
                                    <input type="file" id="image_file_input" accept="image/*" multiple onchange="handleImageUpload(event)" class="hidden">
                                </label>
                                <button type="button" onclick="clearAllPhotos()" class="bg-red-50 text-red-600 border border-red-200 hover:bg-red-100 px-3 py-2 rounded-xl text-xs font-medium transition">전체 삭제</button>
                            </div>
                        </div>
                    </div>

                    <!-- 업로드된 사진 미리보기 영역 (최대 3장) -->
                    <div id="photo_preview_container" class="hidden space-y-2 pt-2">
                        <span class="block text-xs text-slate-500 font-medium">선택된 사진 목록 (<span id="photo_count_text">0</span>/3장):</span>
                        <div id="photo_preview_list" class="flex flex-wrap gap-3"></div>
                    </div>
                </div>

                <!-- 상품 태그 / 상태 -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">상품 태그 / 상태</label>
                    <select id="p_badge" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="인기상품 🔥">인기상품 🔥</option>
                        <option value="한정특가 ⚡">한정특가 ⚡</option>
                        <option value="신상품 ✨">신상품 ✨</option>
                        <option value="상시판매 📦">상시판매 📦</option>
                    </select>
                </div>

                <!-- 이모지 빠른 선택 팔레트 -->
                <div class="bg-indigo-50/50 border border-indigo-100 rounded-xl p-3 flex flex-col justify-center">
                    <label class="block text-[11px] font-bold text-indigo-800 mb-2">✨ 대표 이모지 빠른 선택</label>
                    <div class="flex flex-wrap gap-1.5">
                        <button type="button" onclick="setEmoji('🥟')" class="flex items-center px-2 py-1 bg-white border border-slate-200 rounded-lg text-[11px] hover:bg-indigo-50 hover:border-indigo-200 transition"><span>🥟</span><span class="ml-1 text-slate-600 font-medium">만두류</span></button>
                        <button type="button" onclick="setEmoji('🥩')" class="flex items-center px-2 py-1 bg-white border border-slate-200 rounded-lg text-[11px] hover:bg-indigo-50 hover:border-indigo-200 transition"><span>🥩</span><span class="ml-1 text-slate-600 font-medium">소고기</span></button>
                        <button type="button" onclick="setEmoji('🍳')" class="flex items-center px-2 py-1 bg-white border border-slate-200 rounded-lg text-[11px] hover:bg-indigo-50 hover:border-indigo-200 transition"><span>🍳</span><span class="ml-1 text-slate-600 font-medium">간편요리</span></button>
                        <button type="button" onclick="setEmoji('🍗')" class="flex items-center px-2 py-1 bg-white border border-slate-200 rounded-lg text-[11px] hover:bg-indigo-50 hover:border-indigo-200 transition"><span>🍗</span><span class="ml-1 text-slate-600 font-medium">닭고기</span></button>
                        <button type="button" onclick="setEmoji('🍖')" class="flex items-center px-2 py-1 bg-white border border-slate-200 rounded-lg text-[11px] hover:bg-indigo-50 hover:border-indigo-200 transition"><span>🍖</span><span class="ml-1 text-slate-600 font-medium">돼지고기</span></button>
                        <button type="button" onclick="setEmoji('🍲')" class="flex items-center px-2 py-1 bg-white border border-slate-200 rounded-lg text-[11px] hover:bg-indigo-50 hover:border-indigo-200 transition"><span>🍲</span><span class="ml-1 text-slate-600 font-medium">국/찌개</span></button>
                        <button type="button" onclick="setEmoji('🍎')" class="flex items-center px-2 py-1 bg-white border border-slate-200 rounded-lg text-[11px] hover:bg-indigo-50 hover:border-indigo-200 transition"><span>🍎</span><span class="ml-1 text-slate-600 font-medium">과일</span></button>
                        <button type="button" onclick="setEmoji('🔥')" class="flex items-center px-2 py-1 bg-white border border-slate-200 rounded-lg text-[11px] hover:bg-indigo-50 hover:border-indigo-200 transition"><span>🔥</span><span class="ml-1 text-slate-600 font-medium">인기</span></button>
                        <button type="button" onclick="setEmoji('🧊')" class="flex items-center px-2 py-1 bg-white border border-slate-200 rounded-lg text-[11px] hover:bg-indigo-50 hover:border-indigo-200 transition"><span>🧊</span><span class="ml-1 text-slate-600 font-medium">냉동</span></button>
                        <button type="button" onclick="setEmoji('❄️')" class="flex items-center px-2 py-1 bg-white border border-slate-200 rounded-lg text-[11px] hover:bg-indigo-50 hover:border-indigo-200 transition"><span>❄️</span><span class="ml-1 text-slate-600 font-medium">냉장</span></button>
                    </div>
                </div>

                <!-- 상품 상세 설명 -->
                <div class="md:col-span-2">
                    <label class="block text-xs font-semibold text-slate-600 mb-1">상품 상세 설명</label>
                    <input type="text" id="p_desc" placeholder="국내산 돈육과 신선한 야채가 가득!" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>

                <!-- 저장 및 취소 버튼 영역 -->
                <div class="md:col-span-2 flex space-x-2 pt-2">
                    <button type="button" onclick="saveCurrentProduct()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl text-sm transition shadow-md flex items-center justify-center space-x-1.5">
                        <span>💾 변경 사항 저장하기</span>
                    </button>
                    <button type="button" id="cancel_btn" onclick="resetForm()" class="hidden bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold px-5 py-3.5 rounded-xl text-sm transition">
                        취소
                    </button>
                </div>
            </div>
        </div>

        <!-- 현재 등록된 상품 리스트 -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 md:p-6 space-y-4">
            <div class="flex flex-wrap justify-between items-center gap-2">
                <h2 class="font-bold text-slate-800 text-base">📦 현재 스토어 상품 목록 (<span id="product_count">0</span>개)</h2>
                <div class="flex flex-wrap gap-1.5">
                    <button onclick="addNewProductMode()" class="text-xs bg-indigo-600 hover:bg-indigo-700 text-white px-3.5 py-1.5 rounded-lg transition font-bold">+ 새 상품 추가하기</button>
                    <label class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg transition font-medium cursor-pointer">
                        데이터 복구(JSON) <input type="file" accept=".json" onchange="importProductsJson(event)" class="hidden">
                    </label>
                    <button onclick="exportProductsJson()" class="text-xs bg-emerald-50 hover:bg-emerald-100 text-emerald-700 px-3 py-1.5 rounded-lg transition font-medium">백업 (`D:\oneul_hankki` 지정)</button>
                    <button onclick="resetDefaultProducts()" class="text-xs bg-rose-50 hover:bg-rose-100 text-rose-600 px-3 py-1.5 rounded-lg transition font-medium">초기화</button>
                </div>
            </div>

            <div id="product_list_container" class="space-y-3"></div>
        </div>
    </main>

    <!-- 저장 완료 토스트 알림 영역 -->
    <div id="toast_container" class="fixed bottom-5 right-5 z-50 pointer-events-none"></div>

    <script>
        let currentPhotos = [];

        const defaultProducts = [
            { name: '수제 프리미엄 만두 세트 (1kg)', price: 18000, category: '🥟만두류', img: '🥟', photos: ['https://images.unsplash.com/photo-1541529086526-db283c563270?w=500&auto=format&fit=crop&q=60'], badge: '인기상품 🔥', desc: '속이 꽉 찬 육즙 가득 수제 만두' },
            { name: '한돈 냉동 삼겹살 구이용 (500g)', price: 14000, category: '🥩소고기', img: '🥩', photos: ['https://images.unsplash.com/photo-1603048588665-791ca8aea617?w=500&auto=format&fit=crop&q=60'], badge: '한정특가 ⚡', desc: '고소하고 부드러운 국내산 한돈 삼겹살' },
            { name: '오늘한끼 볶음밥 5종 골라담기', price: 22000, category: '🍳간편요리', img: '🍳', photos: ['https://images.unsplash.com/photo-1512058564366-18510be2db19?w=500&auto=format&fit=crop&q=60'], badge: '신상품 ✨', desc: '간편하게 즐기는 든든한 한 끼 볶음밥' },
            { name: '매콤 닭다리살 순살 볶음 (400g)', price: 13000, category: '🍗닭고기', img: '🍗', photos: ['https://images.unsplash.com/photo-1626082927389-6cd097cdc6ec?w=500&auto=format&fit=crop&q=60'], badge: '상시판매 📦', desc: '술안주 및 밥반찬으로 제격인 매콤 순살 닭볶음' }
        ];

        function showToast(message) {
            const container = document.getElementById('toast_container');
            const toast = document.createElement('div');
            toast.className = 'bg-slate-900 text-white text-xs px-4 py-2.5 rounded-xl shadow-lg toast-slide mt-2 flex items-center space-x-2';
            toast.innerHTML = `<span>💾</span> <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }

        function getProducts() {
            try {
                let products = JSON.parse(localStorage.getItem('store_products') || 'null');
                if (!products) {
                    products = defaultProducts;
                    localStorage.setItem('store_products', JSON.stringify(products));
                }
                products.forEach(p => {
                    if (!p.category) p.category = '🥟만두류';
                    if (!p.photos && p.photo) {
                        p.photos = [p.photo];
                    } else if (!p.photos) {
                        p.photos = [];
                    }
                });
                return products;
            } catch (e) {
                console.error("저장소 데이터를 읽는 중 오류 발생:", e);
                return defaultProducts;
            }
        }

        function renderProducts() {
            const products = getProducts();
            const container = document.getElementById('product_list_container');
            document.getElementById('product_count').innerText = products.length;

            let html = '';
            products.forEach((p, index) => {
                let mainPhoto = (p.photos && p.photos.length > 0) ? p.photos[0] : null;
                let imageDisplay = mainPhoto 
                    ? `<img src="${mainPhoto}" class="w-full h-full object-cover rounded-xl" alt="상품사진">` 
                    : (p.img || '🛍️');

                let photoBadge = (p.photos && p.photos.length > 1) ? `<span class="text-[9px] bg-emerald-100 text-emerald-700 px-1.5 py-0.2 rounded-full font-bold ml-1">+${p.photos.length - 1}</span>` : '';

                html += `
                    <div class="flex items-center justify-between p-4 bg-slate-50 border border-slate-200 rounded-xl hover:bg-slate-100 transition">
                        <div class="flex items-center space-x-3 overflow-hidden">
                            <div class="w-12 h-12 bg-white rounded-xl shadow-sm flex items-center justify-center text-2xl border border-slate-100 overflow-hidden flex-shrink-0 relative">${imageDisplay}</div>
                            <div class="truncate">
                                <div class="flex items-center space-x-2">
                                    <span class="font-bold text-slate-800 text-sm truncate">${p.name || '(이름 없는 상품)'}</span>
                                    <span class="text-[10px] bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded-full font-semibold flex-shrink-0">${p.category || '🥟만두류'}</span>
                                    <span class="text-[10px] bg-slate-200 text-slate-700 px-2 py-0.5 rounded-full font-semibold flex-shrink-0">${p.badge}</span>
                                    ${photoBadge}
                                </div>
                                <p class="text-xs text-slate-500 mt-0.5 truncate">${p.desc || ''}</p>
                                <span class="text-xs font-bold text-emerald-600 mt-1 inline-block">${Number(p.price || 0).toLocaleString()}원</span>
                            </div>
                        </div>
                        <div class="flex items-center space-x-1 flex-shrink-0 ml-2">
                            <button onclick="moveProduct(${index}, -1)" class="p-2 text-slate-400 hover:text-indigo-600 text-xs" title="위로">⬆️</button>
                            <button onclick="moveProduct(${index}, 1)" class="p-2 text-slate-400 hover:text-indigo-600 text-xs" title="아래로">⬇️</button>
                            <button onclick="editProduct(${index})" class="px-3 py-1.5 bg-white border border-slate-200 hover:bg-indigo-50 hover:text-indigo-600 text-xs font-semibold rounded-lg shadow-sm transition">수정</button>
                            <button onclick="deleteProduct(${index})" class="px-3 py-1.5 bg-white border border-slate-200 hover:bg-red-50 hover:text-red-600 text-xs font-semibold rounded-lg shadow-sm transition">삭제</button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function saveCurrentProduct() {
            const editIndex = parseInt(document.getElementById('edit_index').value);
            const name = document.getElementById('p_name').value.trim();
            const price = parseInt(document.getElementById('p_price').value) || 0;
            const category = document.getElementById('p_category').value.trim() || '🥟만두류';
            const img = document.getElementById('p_img').value || '🥟';
            const badge = document.getElementById('p_badge').value;
            const desc = document.getElementById('p_desc').value;

            if (!name) {
                alert('상품명을 입력해주세요.');
                document.getElementById('p_name').focus();
                return;
            }

            let products = getProducts();
            const newObj = { name, price, category, img, photos: [...currentPhotos], badge, desc };

            if (editIndex === -1) {
                products.push(newObj);
                showToast('새 상품이 성공적으로 추가되었습니다!');
            } else {
                products[editIndex] = newObj;
                showToast('상품 정보가 성공적으로 수정되었습니다!');
            }

            try {
                localStorage.setItem('store_products', JSON.stringify(products));
            } catch (e) {
                alert('저장 공간(용량)이 부족합니다! 업로드한 사진의 용량이 너무 큽니다.');
                return;
            }

            renderProducts();
            resetForm();
        }

        function handleImageUpload(event) {
            const files = event.target.files;
            if (!files || files.length === 0) return;

            const remainingSlots = 3 - currentPhotos.length;
            if (remainingSlots <= 0) {
                alert('사진은 최대 3장까지만 등록할 수 있습니다.');
                event.target.value = '';
                return;
            }

            const filesToProcess = Array.from(files).slice(0, remainingSlots);

            filesToProcess.forEach(file => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 400;
                        const MAX_HEIGHT = 400;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > MAX_WIDTH) {
                                height *= MAX_WIDTH / width;
                                width = MAX_WIDTH;
                            }
                        } else {
                            if (height > MAX_HEIGHT) {
                                width *= MAX_HEIGHT / height;
                                height = MAX_HEIGHT;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.6);
                        currentPhotos.push(compressedDataUrl);
                        updatePhotoPreviews();
                        showToast('사진이 압축 업로드되었습니다.');
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
            event.target.value = '';
        }

        function updatePhotoPreviews() {
            const container = document.getElementById('photo_preview_container');
            const list = document.getElementById('photo_preview_list');
            const countText = document.getElementById('photo_count_text');

            countText.innerText = currentPhotos.length;

            if (currentPhotos.length > 0) {
                container.classList.remove('hidden');
                container.classList.add('block');
                let html = '';
                currentPhotos.forEach((photoUrl, idx) => {
                    html += `
                        <div class="relative group">
                            <img src="${photoUrl}" class="w-16 h-16 object-cover rounded-xl border border-slate-300 shadow-sm" alt="미리보기${idx+1}">
                            <button type="button" onclick="removePhoto(${idx})" class="absolute -top-1.5 -right-1.5 bg-red-600 text-white rounded-full w-5 h-5 flex items-center justify-center text-[10px] shadow hover:bg-red-700 transition" title="삭제">✕</button>
                        </div>
                    `;
                });
                list.innerHTML = html;
            } else {
                container.classList.add('hidden');
                container.classList.remove('block');
                list.innerHTML = '';
            }
        }

        function removePhoto(index) {
            currentPhotos.splice(index, 1);
            updatePhotoPreviews();
            showToast('사진이 제거되었습니다.');
        }

        function clearAllPhotos() {
            currentPhotos = [];
            const fileInput = document.getElementById('image_file_input');
            if (fileInput) fileInput.value = '';
            updatePhotoPreviews();
            showToast('모든 사진이 제거되었습니다.');
        }

        function setEmoji(emoji) {
            document.getElementById('p_img').value = emoji;
        }

        function setCategory(categoryText) {
            document.getElementById('p_category').value = categoryText;
        }

        function addNewProductMode() {
            document.getElementById('edit_index').value = -1;
            document.getElementById('p_name').value = '';
            document.getElementById('p_price').value = '';
            document.getElementById('p_category').value = '🥟만두류';
            document.getElementById('p_img').value = '📦';
            document.getElementById('p_desc').value = '';
            currentPhotos = [];
            updatePhotoPreviews();
            
            document.getElementById('form_title').innerText = '➕ 새 상품 추가하기';
            document.getElementById('cancel_btn').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function editProduct(index) {
            const products = getProducts();
            const p = products[index];
            document.getElementById('edit_index').value = index;
            document.getElementById('p_name').value = p.name || '';
            document.getElementById('p_price').value = p.price || '';
            document.getElementById('p_category').value = p.category || '🥟만두류';
            document.getElementById('p_img').value = p.img || '🥟';
            document.getElementById('p_badge').value = p.badge || '인기상품 🔥';
            document.getElementById('p_desc').value = p.desc || '';
            
            currentPhotos = p.photos ? [...p.photos] : [];
            updatePhotoPreviews();
            
            document.getElementById('form_title').innerText = `✏️ '${p.name || '상품'}' 수정 모드`;
            document.getElementById('cancel_btn').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            document.getElementById('edit_index').value = -1;
            document.getElementById('form_title').innerText = '➕ 새 상품 추가하기';
            document.getElementById('p_name').value = '';
            document.getElementById('p_price').value = '';
            document.getElementById('p_category').value = '🥟만두류';
            document.getElementById('p_img').value = '🥟';
            document.getElementById('p_desc').value = '';
            currentPhotos = [];
            updatePhotoPreviews();
            document.getElementById('cancel_btn').classList.add('hidden');
        }

        function deleteProduct(index) {
            if (confirm('정말 이 상품을 삭제하시겠습니까?')) {
                let products = getProducts();
                products.splice(index, 1);
                localStorage.setItem('store_products', JSON.stringify(products));
                resetForm();
                renderProducts();
                showToast('상품이 삭제되었습니다.');
            }
        }

        function moveProduct(index, direction) {
            let products = getProducts();
            const targetIndex = index + direction;
            if (targetIndex < 0 || targetIndex >= products.length) return;
            
            const temp = products[index];
            products[index] = products[targetIndex];
            products[targetIndex] = temp;
            
            localStorage.setItem('store_products', JSON.stringify(products));
            renderProducts();
            showToast('상품 순서가 변경되었습니다.');
        }

        function resetDefaultProducts() {
            if (confirm('기본 상품 구성으로 초기화하시겠습니까?')) {
                localStorage.setItem('store_products', JSON.stringify(defaultProducts));
                resetForm();
                renderProducts();
                showToast('기본 상품으로 초기화되었습니다.');
            }
        }

        async function exportProductsJson() {
            try {
                const products = getProducts();
                const dataStr = JSON.stringify(products, null, 2);
                const fileName = 'oneul_hankki_backupfile.json';

                if (window.showSaveFilePicker) {
                    try {
                        const options = {
                            suggestedName: fileName,
                            types: [{
                                description: 'JSON 파일',
                                accept: { 'application/json': ['.json'] },
                            }],
                        };
                        const handle = await window.showSaveFilePicker(options);
                        const writable = await handle.createWritable();
                        await writable.write(dataStr);
                        await writable.close();
                        showToast(`'${fileName}' 파일이 지정하신 경로에 저장되었습니다.`);
                        return;
                    } catch (err) {
                        if (err.name !== 'AbortError') {
                            console.log('지정 경로 저장 중 fallback 실행', err);
                        } else {
                            return;
                        }
                    }
                }

                const blob = new Blob([dataStr], { type: 'application/json;charset=utf-8;' });
                const downloadAnchor = document.createElement('a');
                downloadAnchor.href = URL.createObjectURL(blob);
                downloadAnchor.download = fileName;
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
                showToast(`'${fileName}' 백업 파일이 다운로드되었습니다.`);
            } catch (e) {
                alert('백업 파일을 생성하는 도중 오류가 발생했습니다.');
            }
        }

        function importProductsJson(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) {
                        localStorage.setItem('store_products', JSON.stringify(imported));
                        resetForm();
                        renderProducts();
                        showToast('백업 파일을 성공적으로 복구했습니다.');
                    } else {
                        alert('올바른 상품 백업 파일 형식이 아닙니다. (배열 형태가 아님)');
                    }
                } catch (err) {
                    alert('JSON 파일을 읽는 중 형식이 잘못되었거나 오류가 발생했습니다.');
                } finally {
                    event.target.value = '';
                }
            };
            reader.readAsText(file);
        }

        renderProducts();
    </script>
</body>
</html>
