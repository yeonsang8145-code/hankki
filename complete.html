<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주문 완료 - 오늘한끼냉동</title>
    <script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <style>body{background:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}</style>
</head>
<body class="text-slate-800 antialiased pb-12">
<header class="bg-emerald-600 text-white py-4 px-4 shadow-md sticky top-0 z-50">
  <div class="max-w-md mx-auto text-center"><h1 class="text-lg font-bold">🎉 주문이 정상 접수되었습니다</h1></div>
</header>
<main class="max-w-md mx-auto p-4 mt-4">
  <div id="error_box" class="hidden bg-white rounded-xl shadow-sm p-6 text-center border border-red-100">
    <div class="text-3xl mb-3">⚠️</div>
    <h2 class="font-bold text-slate-900">주문 정보를 찾을 수 없습니다.</h2>
    <p class="text-sm text-slate-500 mt-2">주문 완료 페이지를 새로 열었거나 세션 정보가 만료되었습니다.</p>
    <a href="index.html" class="block mt-5 bg-slate-800 text-white font-bold py-3 rounded-xl">상품 보러가기</a>
  </div>

  <div id="success_box" class="bg-white rounded-xl shadow-sm p-6 text-center border border-slate-100">
    <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center text-3xl mx-auto mb-3">✓</div>
    <h2 id="welcome_msg" class="text-xl font-bold text-slate-900">고객님, 감사합니다!</h2>
    <p class="text-slate-500 text-sm mt-1">아래 계좌로 입금해 주시면 확인 후 빠른 배송을 도와드립니다.</p>

    <div class="bg-slate-50 rounded-xl p-4 my-6 text-left space-y-3 border border-slate-200">
      <div class="flex justify-between text-sm"><span class="text-slate-500">주문번호</span><span id="order_id_val" class="font-semibold text-slate-700">-</span></div>
      <div class="border-t border-slate-200 pt-2">
        <span class="text-xs text-slate-500 block mb-1.5 font-medium">주문 상품 전체 목록</span>
        <div id="product_val" class="space-y-1.5 bg-white p-3 rounded-lg border border-slate-200 text-sm leading-relaxed"></div>
      </div>
      <div class="flex justify-between text-sm pt-1"><span class="text-slate-500">입금할 금액</span><span id="price_val" class="font-bold text-emerald-600 text-base">-</span></div>
      <div class="flex justify-between text-sm"><span class="text-slate-500">입금 계좌</span><span class="font-medium text-slate-800 text-right">국민은행<br><span class="font-bold text-indigo-600">123456-04-123456</span></span></div>
      <div class="flex justify-between text-sm"><span class="text-slate-500">예금주</span><span class="font-medium text-slate-800">(주)연상네트웍스</span></div>
      <div class="flex justify-between text-sm pt-2 border-t border-slate-200"><span class="text-slate-500">입금자명</span><span id="depositor_val" class="font-bold text-red-500">-</span></div>
    </div>

    <div class="bg-amber-50 border border-amber-200 rounded-lg p-3 text-xs text-amber-800 text-left mb-4">⚠️ 주문자 성함 또는 실제 입금자 성함이 일치해야 입금 확인이 원활합니다.</div>
    <button id="orders_btn" onclick="goOrders()" class="block w-full bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold py-3.5 rounded-xl text-center text-sm mb-2">📦 나의 주문 내역 확인하기</button>
    <a href="index.html" class="block w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-3.5 rounded-xl text-center text-sm">다른 상품 쇼핑하러 가기</a>
  </div>
</main>
<script>
const firebaseConfig={apiKey:"AIzaSyApTZXjW03-8Z2AMh8uOksT7LzM-hwX39I",authDomain:"oneul-hankki.firebaseapp.com",databaseURL:"https://oneul-hankki-default-rtdb.firebaseio.com",projectId:"oneul-hankki",storageBucket:"oneul-hankki.firebasestorage.app",messagingSenderId:"512249280108",appId:"1:512249280108:web:8ba0d79e819c7ec43c0a49"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
(async()=>{
  const user=auth.currentUser;
  let order=null; try{order=JSON.parse(sessionStorage.getItem('pending_order_complete')||'null')}catch(e){}
  if(!order || !order.orderId || !order.name){
    document.getElementById('success_box').classList.add('hidden');document.getElementById('error_box').classList.remove('hidden');return;
  }
  // 비회원 주문도 완료 페이지에서 정상적으로 확인할 수 있습니다.
  if(!user || user.isAnonymous){
    const btn=document.getElementById('orders_btn');
    if(btn){
      btn.textContent='📦 회원가입하면 주문 내역을 편리하게 확인할 수 있습니다';
      btn.onclick=()=>location.href='index.html';
    }
  }
  sessionStorage.removeItem('pending_order_complete');
  document.getElementById('welcome_msg').textContent=order.name+' 고객님, 감사합니다!';
  document.getElementById('order_id_val').textContent=order.orderId;
  document.getElementById('price_val').textContent=Number(order.price||0).toLocaleString()+'원';
  document.getElementById('depositor_val').textContent=order.depositor||order.name;
  const lines=String(order.product||'오늘한끼냉동 상품').split(/\n|,/).map(x=>x.trim()).filter(Boolean);
  const box=document.getElementById('product_val');
  box.innerHTML='';
  lines.forEach(line=>{const d=document.createElement('div');d.className='flex items-start text-xs text-slate-800 pb-1.5 border-b border-slate-100';const b=document.createElement('span');b.className='text-indigo-600 font-bold mr-2';b.textContent='•';const t=document.createElement('span');t.className='flex-1 font-medium';t.textContent=line;d.append(b,t);box.appendChild(d)});
})();
function goOrders(){location.href='orders.html'}
</script>
</body>
</html>
