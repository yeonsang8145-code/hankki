<!DOCTYPE html>
<html lang="ko">
<head>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>상품 주문서 (무통장 입금)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
</head>
<body class="text-slate-800 antialiased pb-12">
    <header class="bg-indigo-600 text-white py-4 px-4 shadow-md sticky top-0 z-50">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="text-lg font-bold">💳 주문서 작성 / 결제</h1>
            <a href="index.html" class="text-xs bg-indigo-500 hover:bg-indigo-400 px-3 py-1.5 rounded-lg font-medium transition">← 상품목록</a>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 mt-2 space-y-4">
        <!-- 장바구니 요약 정보 -->
        <div class="bg-white rounded-xl shadow-sm p-4 border border-slate-100 space-y-3">
            <div class="flex justify-between items-center border-b border-slate-100 pb-2">
                <span class="text-xs text-indigo-600 font-bold uppercase tracking-wide">🛒 장바구니 주문 상품</span>
                <span id="cart_item_count" class="text-xs text-slate-400">0개 상품</span>
            </div>
            
            <div id="cart_items_container" class="divide-y divide-slate-100 max-h-56 overflow-y-auto space-y-2"></div>

            <div class="border-t border-slate-100 pt-3 space-y-1.5 text-sm">
                <div class="flex justify-between items-center text-slate-600">
                    <span>상품 합계</span>
                    <span id="product_subtotal" class="font-medium text-slate-800">0원</span>
                </div>
                <div class="flex justify-between items-center text-slate-600">
                    <span>배송비 <span class="text-xs text-slate-400">(5만원 미만 3,000원)</span></span>
                    <span id="shipping_fee_display" class="font-medium text-slate-800">3,000원</span>
                </div>
            </div>
        </div>

        <!-- 주문자 및 배송 정보 입력 폼 (구조 오류 수정 완료) -->
        <form id="orderForm" onsubmit="handleSubmit(event)" class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-4">
            <h2 class="font-bold text-slate-900 text-sm border-b pb-2">👤 주문자 및 배송 정보 입력</h2>
            
            <div class="space-y-3 text-xs">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">주문자 성함 <span class="text-red-500">*</span></label>
                    <input type="text" id="buyer_name" required placeholder="주문자 성함을 입력하세요" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">휴대폰 번호 <span class="text-red-500">*</span></label>
                    <input type="tel" id="buyer_phone" required placeholder="010-0000-0000" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">배송지 주소 <span class="text-red-500">*</span></label>
                    <input type="text" id="shipping_address" required placeholder="도로명 주소를 입력하세요" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">실제 입금자명 (다를 경우만 입력)</label>
                    <input type="text" id="depositor_name" placeholder="미입력시 주문자명과 동일하게 처리" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">배송 메모</label>
                    <input type="text" id="memo" placeholder="부재시 문 앞에 놓아주세요" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">주문 조회 비밀번호 4자리 <span class="text-red-500">*</span></label>
                    <input type="password" id="order_password" required maxlength="4" placeholder="숫자 4자리 입력" class="w-full text-center tracking-widest text-base bg-slate-50 border border-slate-300 rounded-lg p-3 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
            </div>

            <div class="bg-indigo-50 rounded-xl p-4 flex justify-between items-center mt-4">
                <div>
                    <span class="text-xs text-indigo-700 font-medium">최종 결제 금액 (상품+배송비)</span>
                    <div id="total_display" class="text-xl font-bold text-indigo-900">0원</div>
                </div>
                <span class="text-xs bg-indigo-200 text-indigo-800 px-2 py-1 rounded font-medium">무통장입금</span>
            </div>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-xl text-center shadow-lg transition duration-200 mt-2">
                주문 완료 및 계좌 안내받기
            </button>
        </form>
    </main>

    <!-- 주문 완료 팝업 모달 -->
    <div id="order_popup_modal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl text-center">
            <span class="text-3xl">🎉</span>
            <h3 class="text-lg font-bold text-slate-900">주문이 성공적으로 접수되었습니다!</h3>
            <p class="text-xs text-slate-500">잠시 후 입금 계좌 안내 페이지로 이동합니다.</p>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyApTZXjW03-8Z2AMh8uOksT7LzM-hwX39I",
            authDomain: "oneul-hankki.firebaseapp.com",
            databaseURL: "https://oneul-hankki-default-rtdb.firebaseio.com",
            projectId: "oneul-hankki",
            storageBucket: "oneul-hankki.firebasestorage.app",
            messagingSenderId: "512249280108",
            appId: "1:512249280108:web:8ba0d79e819c7ec43c0a49"
        };
        
        let db = null;
        try {
            if (typeof firebase !== 'undefined') {
                if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
                db = firebase.database();
            }
        } catch (e) {}

        let cartData = [];
        let productSubtotal = 0;
        let shippingFee = 3000;
        let finalTotalPrice = 0;

        window.addEventListener('DOMContentLoaded', () => {
            loadCartData();
            autofillUserInfo();
        });

        function autofillUserInfo() {
            try {
                const loggedUser = JSON.parse(localStorage.getItem('store_logged_in_user') || 'null');
                if (loggedUser) {
                    if (loggedUser.name) document.getElementById('buyer_name').value = loggedUser.name;
                    if (loggedUser.phone) document.getElementById('buyer_phone').value = loggedUser.phone;
                    if (loggedUser.address) document.getElementById('shipping_address').value = loggedUser.address;
                }
            } catch (e) {}
        }

        function loadCartData() {
            try {
                cartData = JSON.parse(localStorage.getItem('store_cart') || '[]');
                const urlParams = new URLSearchParams(window.location.search);
                const directProduct = urlParams.get('full_product');
                const directPrice = Number(urlParams.get('price')) || 0;

                if (directProduct && directPrice > 0 && cartData.length === 0) {
                    cartData = [{ name: directProduct, price: directPrice, qty: 1 }];
                }

                const container = document.getElementById('cart_items_container');
                const countBadge = document.getElementById('cart_item_count');
                
                if (cartData.length === 0) {
                    container.innerHTML = `<div class="text-center py-4 text-slate-400 text-xs">주문할 상품 정보가 없습니다.</div>`;
                    return;
                }

                let totalCount = 0;
                let html = '';
                productSubtotal = 0;

                cartData.forEach(item => {
                    let itemTotal = (Number(item.price) || 0) * (Number(item.qty) || 1);
                    productSubtotal += itemTotal;
                    totalCount += (Number(item.qty) || 1);
                    
                    html += `
                        <div class="py-2 flex justify-between items-center text-xs">
                            <div class="truncate pr-2">
                                <span class="font-bold text-slate-800">${item.name}</span>
                                <span class="text-slate-400 ml-1">(${item.qty || 1}개)</span>
                            </div>
                            <span class="font-semibold text-slate-700 flex-shrink-0">${itemTotal.toLocaleString()}원</span>
                        </div>
                    `;
                });

                container.innerHTML = html;
                countBadge.innerText = `${totalCount}개 상품`;

                shippingFee = productSubtotal >= 50000 ? 0 : 3000;
                finalTotalPrice = productSubtotal + shippingFee;

                document.getElementById('product_subtotal').innerText = productSubtotal.toLocaleString() + '원';
                document.getElementById('shipping_fee_display').innerText = shippingFee === 0 ? '무료배송' : '3,000원';
                document.getElementById('total_display').innerText = finalTotalPrice.toLocaleString() + '원';

            } catch (e) {
                console.error("Cart load error:", e);
            }
        }

        function handleSubmit(event) {
            event.preventDefault();

            if (cartData.length === 0) {
                alert('주문할 상품이 없습니다.');
                return;
            }

            const name = document.getElementById('buyer_name').value.trim();
            const phone = document.getElementById('buyer_phone').value.trim();
            const address = document.getElementById('shipping_address').value.trim();
            const depositor = document.getElementById('depositor_name').value.trim() || name;
            const memo = document.getElementById('memo').value.trim();
            const password = document.getElementById('order_password').value.trim();

            if (!name || !phone || !address || !password) {
                alert('필수 입력 항목을 모두 입력해주세요.');
                return;
            }

            const orderId = 'ORD-' + Math.floor(100000 + Math.random() * 900000);
            const fullProductText = cartData.map(i => `${i.name} (${i.qty || 1}개)`).join('\n');

            const newOrder = {
                orderId: orderId,
                name: name,
                phone: phone,
                address: address,
                depositor: depositor,
                memo: memo,
                password: password,
                product: fullProductText,
                items: cartData,
                price: finalTotalPrice,
                date: new Date().toISOString().replace('T', ' ').substring(0, 16),
                status: '입금대기'
            };

            // Firebase 또는 LocalStorage에 주문 저장
            try {
                let existingOrders = JSON.parse(localStorage.getItem('store_orders') || '[]');
                existingOrders.unshift(newOrder);
                localStorage.setItem('store_orders', JSON.stringify(existingOrders));

                if (db) {
                    db.ref('store_orders').push(newOrder);
                }
            } catch (e) {}

            // 장바구니 비우기
            localStorage.removeItem('store_cart');

            // 완료 팝업 표시 후 완료 페이지로 이동
            document.getElementById('order_popup_modal').classList.remove('hidden');
            setTimeout(() => {
                location.href = `complete.html?order_id=${orderId}&name=${encodeURIComponent(name)}&phone=${encodeURIComponent(phone)}&password=${password}&full_product=${encodeURIComponent(fullProductText)}&price=${finalTotalPrice}&depositor=${encodeURIComponent(depositor)}&memo=${encodeURIComponent(memo)}`;
            }, 1000);
        }
    </script>
</body>
</html>
