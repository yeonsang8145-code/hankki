<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘한끼냉동 - 주문 및 결제</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDK (v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
</head>
<body class="bg-gray-50 font-sans min-h-screen text-gray-800">

    <!-- 상단 네비게이션 -->
    <nav class="bg-white border-b shadow-sm">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="index.html" class="text-xl font-bold text-blue-600">❄️ 오늘한끼냉동</a>
            <span class="text-sm text-gray-500">주문 및 결제</span>
        </div>
    </nav>

    <!-- 메인 컨텐츠 영역 -->
    <main class="max-w-3xl mx-auto px-4 py-8">
        <div class="bg-white p-6 rounded-lg shadow-md mb-6">
            <h2 class="text-xl font-bold border-b pb-3 mb-4">주문 내역 확인</h2>
            
            <!-- 주문 상품 정보 요약 -->
            <div id="order-summary" class="space-y-3 border-b pb-4 mb-4">
                <p class="text-gray-500">주문 정보를 불러오는 중입니다...</p>
            </div>

            <!-- 고객 정보 및 등급 -->
            <div class="bg-blue-50 p-4 rounded-lg mb-6">
                <div class="flex justify-between items-center mb-1">
                    <span class="text-sm font-semibold text-gray-700">주문 고객</span>
                    <span id="user-name" class="font-bold text-gray-900">-</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-sm font-semibold text-gray-700">현재 회원 등급</span>
                    <span id="user-grade" class="px-2 py-0.5 text-xs font-bold rounded bg-gray-200 text-gray-800">-</span>
                </div>
            </div>

            <!-- 결제 금액 정보 -->
            <div class="space-y-2 border-b pb-4 mb-6">
                <div class="flex justify-between text-gray-600">
                    <span>총 상품금액</span>
                    <span id="original-price">0원</span>
                </div>
                <div class="flex justify-between text-red-500 font-medium">
                    <span>회원 등급 할인</span>
                    <span id="discount-price">-0원</span>
                </div>
                <div class="flex justify-between text-xl font-bold text-gray-900 pt-2 border-t">
                    <span>최종 결제예정 금액</span>
                    <span id="final-price" class="text-blue-600">0원</span>
                </div>
            </div>

            <!-- 결제하기 버튼 -->
            <button onclick="processPayment()" id="pay-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg shadow transition duration-200">
                결제하기
            </button>
        </div>
    </main>

    <script>
        // 1. Firebase 설정 (index.html과 동일한 설정 사용)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const database = firebase.database();
        let currentUser = null;
        let currentTotalSpent = 0;
        let finalPayAmount = 0; // 검증 후 저장할 결제 금액

        // 2. 등급 기준 설정 (index.html 기준과 동일하게 유지)
        function calculateGrade(spentAmount) {
            if (spentAmount >= 1000000) return 'VIP';
            if (spentAmount >= 500000) return 'GOLD';
            if (spentAmount >= 200000) return 'SILVER';
            return 'BRONZE';
        }

        // 3. 페이지 로드 시 사용자 세션 및 데이터 검증
        window.onload = function() {
            // URL 파라미터 수신 (index.html에서 넘어온 값)
            const urlParams = new URLSearchParams(window.location.search);
            const rawPrice = parseInt(urlParams.get('price')) || 0;
            const productName = urlParams.get('productName') || '오늘한끼 대표 상품';

            // 세션 스토리지에서 현재 로그인 유저 확인
            const sessionUser = JSON.parse(sessionStorage.getItem('loggedUser'));

            if (!sessionUser || !sessionUser.id) {
                alert('로그인이 필요한 서비스입니다.');
                window.location.href = 'index.html';
                return;
            }

            currentUser = sessionUser;

            // Realtime DB에서 실제 유저의 최신 누적 구매액 조회 (보안 검증)
            database.ref('users/' + currentUser.id).once('value')
                .then((snapshot) => {
                    const userData = snapshot.val();
                    if (!userData) {
                        alert('회원 정보를 찾을 수 없습니다.');
                        return;
                    }

                    currentTotalSpent = userData.totalSpent || 0;
                    const currentGrade = calculateGrade(currentTotalSpent);

                    // 할인율 산정
                    let discountRate = 0;
                    if (currentGrade === 'SILVER') discountRate = 0.03;
                    else if (currentGrade === 'GOLD') discountRate = 0.05;
                    else if (currentGrade === 'VIP') discountRate = 0.10;

                    const discountAmount = Math.floor(rawPrice * discountRate);
                    finalPayAmount = rawPrice - discountAmount;

                    // 화면 UI 반영
                    document.getElementById('order-summary').innerHTML = `
                        <div class="flex justify-between items-center">
                            <span class="font-medium text-gray-800">${productName}</span>
                            <span class="text-gray-600">${rawPrice.toLocaleString()}원</span>
                        </div>
                    `;
                    document.getElementById('user-name').innerText = userData.name || currentUser.id;
                    document.getElementById('user-grade').innerText = currentGrade;
                    document.getElementById('original-price').innerText = `${rawPrice.toLocaleString()}원`;
                    document.getElementById('discount-price').innerText = `-${discountAmount.toLocaleString()}원 (${discountRate * 100}%)`;
                    document.getElementById('final-price').innerText = `${finalPayAmount.toLocaleString()}원`;
                })
                .catch((error) => {
                    console.error("데이터 로드 오류:", error);
                    alert("정보를 불러오는 중 오류가 발생했습니다.");
                });
        };

        // 4. 결제 처리 및 누적 금액 / 회원 등급 자동 승급 로직
        function processPayment() {
            if (finalPayAmount <= 0) {
                alert('올바르지 않은 주문 금액입니다.');
                return;
            }

            const confirmPay = confirm(`${finalPayAmount.toLocaleString()}원을 결제하시겠습니까?`);
            if (!confirmPay) return;

            const btn = document.getElementById('pay-btn');
            btn.disabled = true;
            btn.innerText = '결제 처리 중...';

            // 신규 누적 금액 계산
            const newTotalSpent = currentTotalSpent + finalPayAmount;
            const newGrade = calculateGrade(newTotalSpent);

            // DB 업데이트 트랜잭션 (누적액 & 등급 동시에 반영)
            const updates = {};
            updates[`users/${currentUser.id}/totalSpent`] = newTotalSpent;
            updates[`users/${currentUser.id}/grade`] = newGrade;
            
            // 주문 내역(orders) 생성 기록
            const newOrderKey = database.ref().child('orders').push().key;
            updates[`orders/${newOrderKey}`] = {
                userId: currentUser.id,
                amount: finalPayAmount,
                timestamp: new Date().toISOString(),
                status: 'COMPLETED'
            };

            database.ref().update(updates)
                .then(() => {
                    alert(`결제가 완료되었습니다!\n누적 구매금액: ${newTotalSpent.toLocaleString()}원\n회원 등급: ${newGrade}`);
                    window.location.href = 'index.html'; // 결제 완료 후 메인으로 이동
                })
                .catch((error) => {
                    console.error("결제 처리 오류:", error);
                    alert('결제 처리 중 오류가 발생했습니다.');
                    btn.disabled = false;
                    btn.innerText = '결제하기';
                });
        }
    </script>
</body>
</html>
