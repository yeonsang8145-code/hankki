<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>구매 이력 전체 조회</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
</head>
<body class="text-slate-800 antialiased pb-16">
    <header class="bg-indigo-600 text-white py-4 px-4 shadow-md sticky top-0 z-50">
        <div class="max-w-xl mx-auto flex justify-between items-center">
            <h1 class="text-base font-bold">📦 회원/비회원 전체 구매 이력</h1>
            <a href="index.html" class="text-xs bg-indigo-500 hover:bg-indigo-400 px-3 py-1.5 rounded-lg font-medium transition">스토어로 가기</a>
        </div>
    </header>

    <main class="max-w-xl mx-auto p-4 mt-2 space-y-4">
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex justify-between items-center">
            <div>
                <span id="user_identity_label" class="text-xs text-slate-500 font-semibold block">조회 고객 정보</span>
                <h2 id="target_user_name" class="text-base font-bold text-slate-900 mt-0.5">-</h2>
            </div>
            <span id="total_purchase_count" class="text-xs bg-indigo-50 text-indigo-700 px-2.5 py-1 rounded-full font-bold">총 0건</span>
        </div>

        <!-- 전체 구매 내역 리스트 출력 영역 -->
        <div id="my_order_list_container" class="space-y-3">
            <!-- 동적 바인딩 -->
        </div>

        <div id="no_history_notice" class="bg-white rounded-xl p-10 text-center border border-slate-200 text-slate-400 text-sm hidden">
            조회된 구매 이력이 없습니다.
        </div>
    </main>

    <script>
        function loadMyOrders() {
            const urlParams = new URLSearchParams(window.location.search);
            const mode = urlParams.get('mode');
            const searchName = (urlParams.get('name') || '').trim();
            const searchPw = (urlParams.get('pw') || '').trim();

            let allOrders = [];
            try {
                allOrders = JSON.parse(localStorage.getItem('store_orders') || '[]');
            } catch (e) {
                allOrders = [];
            }

            let filteredOrders = [];

            if (mode === 'list') {
                // 로그인 회원 기준 전체 구매 이력 매칭
                filteredOrders = allOrders.filter(o => String(o.name).trim() === searchName);
                document.getElementById('target_user_name').innerText = `${searchName} 님 (회원 통합 조회)`;
            } else if (mode === 'guest') {
                // 비회원 주문자명 + 비밀번호 4자리 일치 건 전체 매칭
                filteredOrders = allOrders.filter(o => String(o.name).trim() === searchName && String(o.password || o.orderPw) === searchPw);
                document.getElementById('target_user_name').innerText = `${searchName} 님 (비회원 보안 조회)`;
            } else {
                // 파라미터가 없을 경우 전체 데이터 fallback
                filteredOrders = allOrders;
                document.getElementById('target_user_name').innerText = `전체 주문 목록`;
            }

            const container = document.getElementById('my_order_list_container');
            const noNotice = document.getElementById('no_history_notice');
            document.getElementById('total_purchase_count').innerText = `총 ${filteredOrders.length}건`;

            if (filteredOrders.length === 0) {
                container.innerHTML = '';
                noNotice.classList.remove('hidden');
                return;
            }

            noNotice.classList.add('hidden');
            let html = '';

            filteredOrders.forEach(order => {
                let statusColor = 'bg-amber-50 text-amber-700 border-amber-200';
                if (order.status === '입금완료') statusColor = 'bg-emerald-50 text-emerald-700 border-emerald-200';
                else if (order.status === '배송준비') statusColor = 'bg-blue-50 text-blue-700 border-blue-200';
                else if (order.status === '배송중') statusColor = 'bg-red-50 text-red-700 border-red-200';
                else if (order.status === '배송완료') statusColor = 'bg-slate-100 text-slate-700 border-slate-300';

                html += `
                    <div class="bg-white rounded-xl shadow-sm p-4 border border-slate-200 space-y-3">
                        <div class="flex justify-between items-center border-b border-slate-100 pb-2">
                            <div>
                                <span class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded">${order.orderId || '주문번호없음'}</span>
                                <span class="text-xs text-slate-400 ml-2">${order.date || ''}</span>
                            </div>
                            <span class="text-xs font-bold px-2 py-1 rounded border ${statusColor}">${order.status || '입금대기'}</span>
                        </div>

                        <div class="space-y-1">
                            <span class="text-xs text-slate-400 block">구매 상품 상세 내역</span>
                            <p class="font-bold text-slate-800 text-sm">${order.product || order.fullProductDescription}</p>
                        </div>

                        <div class="bg-slate-50 rounded-lg p-3 space-y-1 text-xs text-slate-600 border border-slate-100">
                            <div class="flex justify-between">
                                <span>주문자 / 연락처:</span>
                                <span class="font-semibold text-slate-800">${order.name} (${order.phone})</span>
                            </div>
                            <div class="flex justify-between">
                                <span>실제 입금자명:</span>
                                <span class="font-bold text-red-500">${order.depositor}</span>
                            </div>
                            <div class="flex justify-between">
                                <span>배송 주소:</span>
                                <span class="font-semibold text-slate-800 text-right truncate max-w-[200px]">${order.address}</span>
                            </div>
                            <div class="flex justify-between pt-1 border-t border-slate-200 mt-1 font-bold text-sm">
                                <span class="text-slate-700">총 결제 금액:</span>
                                <span class="text-emerald-600">${Number(order.price || order.totalAmount || 0).toLocaleString()}원</span>
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        loadMyOrders();
    </script>
</body>
</html>
