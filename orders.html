<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘한끼냉동 - 마이페이지 & 주문/등급 조회</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDK (v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
</head>
<body class="bg-gray-50 font-sans min-h-screen text-gray-800">

    <!-- 상단 네비게이션 -->
    <nav class="bg-white border-b shadow-sm">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="index.html" class="text-xl font-bold text-blue-600">❄️ 오늘한끼냉동</a>
            <div class="space-x-4 text-sm">
                <a href="index.html" class="text-gray-600 hover:text-blue-600">쇼핑 계속하기</a>
                <button onclick="logout()" class="text-red-500 font-medium hover:underline">로그아웃</button>
            </div>
        </div>
    </nav>

    <!-- 메인 컨텐츠 영역 -->
    <main class="max-w-4xl mx-auto px-4 py-8 space-y-6">

        <!-- 1. 회원 등급 및 누적 금액 요약 카드 -->
        <div class="bg-white p-6 rounded-xl shadow-md border border-gray-100">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b pb-6">
                <div>
                    <h1 class="text-2xl font-bold text-gray-900" id="user-welcome">안녕하세요, 고객님! 👋</h1>
                    <p class="text-sm text-gray-500 mt-1">오늘한끼냉동을 이용해 주셔서 감사합니다.</p>
                </div>
                <div class="text-right">
                    <span class="text-xs font-semibold text-gray-400 block mb-1">현재 회원 등급</span>
                    <span id="user-grade-badge" class="px-3 py-1 text-sm font-extrabold rounded-full bg-gray-100 text-gray-700">
                        불러오는 중...
                    </span>
                </div>
            </div>

            <!-- 누적 금액 & 다음 등급 게이지 -->
            <div class="mt-6">
                <div class="flex justify-between items-end mb-2">
                    <div>
                        <span class="text-xs font-semibold text-gray-500">총 누적 결제 금액</span>
                        <div class="text-2xl font-bold text-blue-600" id="total-spent-text">0원</div>
                    </div>
                    <div class="text-right text-xs text-gray-500" id="next-grade-info">
                        다음 등급까지 계산 중...
                    </div>
                </div>

                <!-- 프로그레스 바 -->
                <div class="w-full bg-gray-200 rounded-full h-3 overflow-hidden">
                    <div id="grade-progress" class="bg-blue-600 h-3 rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <!-- 2. 회원 등급 혜택 안내표 -->
        <div class="bg-white p-6 rounded-xl shadow-md border border-gray-100">
            <h2 class="text-lg font-bold text-gray-900 mb-4">🏆 회원 등급별 혜택 안내</h2>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-center">
                <div class="p-3 rounded-lg border bg-gray-50" id="card-BRONZE">
                    <div class="font-bold text-gray-700">BRONZE</div>
                    <div class="text-xs text-gray-500 mt-1">20만원 미만</div>
                    <div class="text-sm font-semibold text-blue-600 mt-2">기본 혜택</div>
                </div>
                <div class="p-3 rounded-lg border bg-gray-50" id="card-SILVER">
                    <div class="font-bold text-gray-700">SILVER</div>
                    <div class="text-xs text-gray-500 mt-1">20만원 이상</div>
                    <div class="text-sm font-semibold text-blue-600 mt-2">3% 즉시 할인</div>
                </div>
                <div class="p-3 rounded-lg border bg-gray-50" id="card-GOLD">
                    <div class="font-bold text-yellow-600">GOLD</div>
                    <div class="text-xs text-gray-500 mt-1">50만원 이상</div>
                    <div class="text-sm font-semibold text-blue-600 mt-2">5% 즉시 할인</div>
                </div>
                <div class="p-3 rounded-lg border bg-gray-50" id="card-VIP">
                    <div class="font-bold text-purple-600">VIP</div>
                    <div class="text-xs text-gray-500 mt-1">100만원 이상</div>
                    <div class="text-sm font-semibold text-blue-600 mt-2">10% 즉시 할인</div>
                </div>
            </div>
        </div>

        <!-- 3. 주문 내역 히스토리 -->
        <div class="bg-white p-6 rounded-xl shadow-md border border-gray-100">
            <h2 class="text-lg font-bold text-gray-900 mb-4">📦 최근 주문/결제 내역</h2>
            <div id="orders-list-container" class="space-y-3">
                <p class="text-gray-500 text-sm text-center py-6">주문 내역을 불러오는 중입니다...</p>
            </div>
        </div>

    </main>

    <script>
        // 1. Firebase 설정 (index.html, order.html과 동일한 설정)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const database = firebase.database();
        let currentUser = null;

        // 2. 등급 기준 및 계산 함수
        function calculateGradeInfo(spentAmount) {
            if (spentAmount >= 1000000) {
                return { grade: 'VIP', nextGoal: 1000000, remaining: 0, percent: 100, color: 'bg-purple-100 text-purple-700 border-purple-300' };
            } else if (spentAmount >= 500000) {
                const remaining = 1000000 - spentAmount;
                const percent = Math.min(100, Math.floor(((spentAmount - 500000) / 500000) * 100));
                return { grade: 'GOLD', nextGoal: 1000000, remaining: remaining, percent: percent, color: 'bg-yellow-100 text-yellow-700 border-yellow-300' };
            } else if (spentAmount >= 200000) {
                const remaining = 500000 - spentAmount;
                const percent = Math.min(100, Math.floor(((spentAmount - 200000) / 300000) * 100));
                return { grade: 'SILVER', nextGoal: 500000, remaining: remaining, percent: percent, color: 'bg-gray-200 text-gray-700 border-gray-300' };
            } else {
                const remaining = 200000 - spentAmount;
                const percent = Math.min(100, Math.floor((spentAmount / 200000) * 100));
                return { grade: 'BRONZE', nextGoal: 200000, remaining: remaining, percent: percent, color: 'bg-orange-100 text-orange-700 border-orange-300' };
            }
        }

        // 3. 페이지 초기화
        window.onload = function() {
            const sessionUser = JSON.parse(sessionStorage.getItem('loggedUser'));

            if (!sessionUser || !sessionUser.id) {
                alert('로그인이 필요한 페이지입니다.');
                window.location.href = 'index.html';
                return;
            }

            currentUser = sessionUser;
            document.getElementById('user-welcome').innerText = `안녕하세요, ${currentUser.name || currentUser.id}님! 👋`;

            // 유저 데이터 실시간 조회 및 화면 업데이트
            loadUserData();
            // 주문 목록 조회
            loadUserOrders();
        };

        // 4. 회원 누적 금액 및 등급 UI 렌더링
        function loadUserData() {
            database.ref('users/' + currentUser.id).on('value', (snapshot) => {
                const userData = snapshot.val();
                if (!userData) return;

                const spent = userData.totalSpent || 0;
                const gradeInfo = calculateGradeInfo(spent);

                // UI 업데이트
                document.getElementById('total-spent-text').innerText = `${spent.toLocaleString()}원`;
                
                const badge = document.getElementById('user-grade-badge');
                badge.innerText = gradeInfo.grade;
                badge.className = `px-3 py-1 text-sm font-extrabold rounded-full border ${gradeInfo.color}`;

                document.getElementById('grade-progress').style.width = `${gradeInfo.percent}%`;

                if (gradeInfo.grade === 'VIP') {
                    document.getElementById('next-grade-info').innerText = '최고 등급(VIP) 혜택을 받고 계십니다!';
                } else {
                    document.getElementById('next-grade-info').innerText = `다음 등급까지 ${gradeInfo.remaining.toLocaleString()}원 남음`;
                }

                // 현재 등급 하이라이트 표시
                ['BRONZE', 'SILVER', 'GOLD', 'VIP'].forEach(g => {
                    const card = document.getElementById(`card-${g}`);
                    if (g === gradeInfo.grade) {
                        card.classList.add('border-blue-500', 'bg-blue-50', 'ring-2', 'ring-blue-400');
                    } else {
                        card.classList.remove('border-blue-500', 'bg-blue-50', 'ring-2', 'ring-blue-400');
                    }
                });
            });
        }

        // 5. 사용자의 결제 완료 목록 불러오기
        function loadUserOrders() {
            database.ref('orders')
                .orderByChild('userId')
                .equalTo(currentUser.id)
                .once('value')
                .then((snapshot) => {
                    const container = document.getElementById('orders-list-container');
                    const ordersData = snapshot.val();

                    if (!ordersData) {
                        container.innerHTML = `<p class="text-gray-400 text-sm text-center py-6">결제 내역이 존재하지 않습니다.</p>`;
                        return;
                    }

                    const ordersList = Object.keys(ordersData).map(key => ordersData[key]);
                    // 최신순 정렬
                    ordersList.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

                    let html = '';
                    ordersList.forEach(order => {
                        const formattedDate = new Date(order.timestamp).toLocaleString('ko-KR');
                        html += `
                            <div class="flex justify-between items-center p-4 border rounded-lg hover:bg-gray-50 transition">
                                <div>
                                    <span class="text-xs px-2 py-0.5 rounded bg-green-100 text-green-700 font-bold">결제완료</span>
                                    <div class="text-xs text-gray-400 mt-1">${formattedDate}</div>
                                </div>
                                <div class="text-right">
                                    <div class="font-bold text-gray-900">${order.amount.toLocaleString()}원</div>
                                </div>
                            </div>
                        `;
                    });

                    container.innerHTML = html;
                })
                .catch((err) => {
                    console.error("주문 목록 로딩 실패:", err);
                    document.getElementById('orders-list-container').innerHTML = `<p class="text-red-500 text-sm text-center py-6">주문 내역을 불러오지 못했습니다.</p>`;
                });
        }

        // 6. 로그아웃 처리
        function logout() {
            sessionStorage.removeItem('loggedUser');
            alert('로그아웃 되었습니다.');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
