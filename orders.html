<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주문 내역 조회 - 오늘한끼냉동</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
</head>
<body class="bg-gray-50 text-gray-800">
<div class="max-w-md mx-auto p-4 min-h-screen flex flex-col">
  <header class="text-center pt-4 mb-6">
    <h1 class="text-xl font-bold text-gray-900">📦 주문 내역 조회</h1>
    <p id="sub-title" class="text-sm text-gray-500 mt-1">회원은 로그인한 계정으로, 비회원은 주문 시 입력한 전화번호로 조회할 수 있습니다.</p>
  </header>

  <div id="guest-search" class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 mb-4 hidden">
    <div class="text-center mb-4">
      <div class="text-3xl mb-2">📱</div>
      <h2 class="font-bold text-slate-900">비회원 주문 조회</h2>
      <p class="text-xs text-slate-500 mt-1">주문할 때 입력한 전화번호를 입력해주세요.</p>
    </div>
    <label class="block text-xs font-bold text-slate-700 mb-1">전화번호</label>
    <input type="tel" id="input-phone" inputmode="numeric" autocomplete="tel" class="w-full p-3 border border-slate-200 rounded-xl text-sm mb-3" placeholder="010-0000-0000">
    <button onclick="searchGuestOrders()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl text-sm font-bold">주문 내역 조회하기</button>
    <p class="text-[11px] text-slate-400 mt-3 text-center">전화번호는 숫자만 입력해도 조회됩니다.</p>
  </div>

  <div id="member-info" class="hidden bg-indigo-50 border border-indigo-100 rounded-xl p-3 mb-4 text-xs text-indigo-700"></div>
  <div id="order-history-container" class="space-y-4 flex-1">
    <div class="text-center text-gray-400 py-8 text-sm">조회 방법을 준비하는 중입니다...</div>
  </div>

  <div class="mt-8 pb-4 space-y-2">
    <button onclick="location.href='index.html'" class="w-full bg-emerald-600 text-white py-3 rounded-lg font-semibold hover:bg-emerald-700 transition shadow-sm">계속 쇼핑하기</button>
  </div>
</div>
<script>
const firebaseConfig={apiKey:"AIzaSyApTZXjW03-8Z2AMh8uOksT7LzM-hwX39I",authDomain:"oneul-hankki.firebaseapp.com",databaseURL:"https://oneul-hankki-default-rtdb.firebaseio.com",projectId:"oneul-hankki",storageBucket:"oneul-hankki.firebasestorage.app",messagingSenderId:"512249280108",appId:"1:512249280108:web:8ba0d79e819c7ec43c0a49"};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();
const auth=firebase.auth();
let currentAuthUser=null;

function normalizePhone(v){return String(v||'').replace(/[^0-9]/g,'');}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function statusClass(status){
  if(status==='입금완료') return 'bg-emerald-50 text-emerald-700';
  if(status==='배송준비') return 'bg-blue-50 text-blue-700';
  if(status==='배송중') return 'bg-red-50 text-red-700';
  if(status==='배송완료') return 'bg-slate-100 text-slate-700';
  return 'bg-amber-50 text-amber-700';
}
function renderOrders(orders, title){
  const container=document.getElementById('order-history-container');
  if(title) document.getElementById('sub-title').textContent=title;
  if(!orders.length){
    container.innerHTML='<div class="bg-white p-6 rounded-xl shadow-sm text-center border border-gray-100"><p class="text-gray-500 text-sm">조회된 주문 내역이 없습니다.</p></div>';
    return;
  }
  orders.sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
  container.innerHTML=orders.map(order=>{
    const product=esc(order.product||'상품 정보 없음');
    return `<div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-2">
      <div class="flex justify-between items-center mb-1 pb-2 border-b border-slate-100">
        <span class="text-xs font-bold text-indigo-600">주문번호: ${esc(order.orderId||'미발급')}</span>
        <span class="text-xs text-slate-400">${esc(order.date||'')}</span>
      </div>
      <div class="text-sm space-y-1">
        <p><span class="text-slate-400 text-xs">주문 상품:</span> <span class="font-bold text-slate-800 whitespace-pre-line">${product}</span></p>
        <p><span class="text-slate-400 text-xs">결제 금액:</span> <span class="font-bold text-emerald-600">${Number(order.price||0).toLocaleString()}원</span></p>
        ${order.name ? `<p><span class="text-slate-400 text-xs">주문자:</span> <span class="text-slate-700 font-semibold">${esc(order.name)}</span></p>` : ''}
      </div>
      <div class="flex justify-between items-center pt-2 border-t border-slate-100 text-xs">
        <span class="text-slate-400">주문번호로 문의해주세요.</span>
        <span class="px-2.5 py-1 rounded-full font-bold ${statusClass(order.status)}">${esc(order.status||'입금대기')}</span>
      </div>
    </div>`;
  }).join('');
}

async function prepareGuestAuth(){
  if(auth.currentUser) return auth.currentUser;
  const cred=await auth.signInAnonymously();
  return cred.user;
}

async function init(){
  const guestBox=document.getElementById('guest-search');
  const memberInfo=document.getElementById('member-info');
  const container=document.getElementById('order-history-container');
  auth.onAuthStateChanged(async user=>{
    currentAuthUser=user||null;
    if(user && !user.isAnonymous){
      guestBox.classList.add('hidden');
      memberInfo.classList.remove('hidden');
      memberInfo.textContent='회원 계정으로 로그인되어 있습니다. 본인 주문 내역을 자동으로 조회합니다.';
      await loadMemberOrders(user);
      return;
    }
    guestBox.classList.remove('hidden');
    memberInfo.classList.add('hidden');
    container.innerHTML='<div class="bg-white p-6 rounded-xl shadow-sm text-center border border-gray-100"><p class="text-gray-500 text-sm">전화번호를 입력하면 비회원 주문 내역을 조회할 수 있습니다.</p></div>';
  });
}

async function loadMemberOrders(user){
  const container=document.getElementById('order-history-container');
  try{
    const snap=await db.ref('store_orders').orderByChild('ownerUid').equalTo(user.uid).once('value');
    const data=snap.val()||{};
    const orders=Object.keys(data).map(k=>({firebaseKey:k,...data[k]})).filter(o=>o.ownerUid===user.uid);
    let profile={};
    try{const ps=await db.ref('users/'+user.uid).once('value'); profile=ps.val()||{};}catch(e){}
    renderOrders(orders,`${profile.name||user.email||'회원'}님의 주문 내역입니다.`);
  }catch(e){
    console.error(e);
    container.innerHTML='<div class="bg-white p-6 rounded-xl shadow-sm text-center border border-red-100"><p class="text-red-500 text-sm">회원 주문 내역을 조회하지 못했습니다. 잠시 후 다시 시도해주세요.</p></div>';
  }
}

async function searchGuestOrders(){
  const phone=normalizePhone(document.getElementById('input-phone').value);
  const container=document.getElementById('order-history-container');
  if(phone.length<9 || phone.length>20){alert('올바른 전화번호를 입력해주세요.');return;}
  try{
    const user=await prepareGuestAuth();
    if(!user || !user.isAnonymous){alert('비회원 조회 인증을 준비하지 못했습니다.');return;}
    container.innerHTML='<div class="text-center text-gray-400 py-8 text-sm">주문 내역을 조회하는 중입니다...</div>';
    const snap=await db.ref('guest_order_lookup/'+phone).once('value');
    const data=snap.val()||{};
    const orders=Object.keys(data).map(k=>({firebaseKey:k,...data[k]})).filter(o=>o.phoneSearch===phone);
    renderOrders(orders,`전화번호 ${formatPhone(phone)}로 조회된 비회원 주문입니다.`);
  }catch(e){
    console.error('비회원 주문 조회 실패:',e);
    container.innerHTML='<div class="bg-white p-6 rounded-xl shadow-sm text-center border border-red-100"><p class="text-red-500 text-sm">주문 내역 조회에 실패했습니다.</p><p class="text-xs text-slate-400 mt-2">전화번호를 확인한 후 다시 시도해주세요.</p></div>';
  }
}
function formatPhone(v){
  const s=normalizePhone(v);
  if(s.length===11) return s.replace(/(\d{3})(\d{4})(\d{4})/,'$1-$2-$3');
  if(s.length===10) return s.replace(/(\d{3})(\d{3})(\d{4})/,'$1-$2-$3');
  return s;
}
document.addEventListener('DOMContentLoaded',init);
</script>
</body>
</html>
