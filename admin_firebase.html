<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>관리자 - 오늘한끼냉동 주문 관리</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
<style>body{background:#f1f5f9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}</style>
</head>
<body class="text-slate-800 antialiased pb-16">
<header class="bg-slate-900 text-white py-4 px-4 shadow-md sticky top-0 z-50"><div class="max-w-2xl mx-auto flex justify-between items-center"><h1 class="text-base font-bold">📊 연상네트웍스 관리자 대시보드</h1><div class="flex gap-2"><button id="logout_btn" onclick="logoutAdmin()" class="text-xs bg-slate-700 px-3 py-1.5 rounded-lg">로그아웃</button><a href="index.html" class="text-xs bg-slate-800 px-3 py-1.5 rounded-lg">스토어</a></div></div></header>
<main class="max-w-2xl mx-auto p-4 mt-2 space-y-4">
<div id="login_box" class="bg-white rounded-2xl shadow-sm border p-5 space-y-3"><h2 class="font-bold">🔐 관리자 로그인</h2><p class="text-xs text-slate-500">Firebase Authentication에 등록된 관리자 계정으로 로그인하세요.</p><input id="admin_email" type="email" placeholder="관리자 이메일" class="w-full border rounded-xl p-3 text-sm"><input id="admin_password" type="password" placeholder="비밀번호" class="w-full border rounded-xl p-3 text-sm"><button onclick="loginAdmin()" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl">로그인</button><div id="login_msg" class="text-xs text-red-500"></div></div>
<div id="dashboard" class="hidden space-y-4">
<div class="grid grid-cols-2 gap-3"><div class="bg-white p-4 rounded-xl shadow-sm border"><span class="text-xs text-slate-500">총 접수 주문</span><div id="total_orders_count" class="text-2xl font-bold mt-1">0건</div></div><div class="bg-white p-4 rounded-xl shadow-sm border"><span class="text-xs text-slate-500">입금 대기</span><div id="pending_orders_count" class="text-2xl font-bold text-indigo-600 mt-1">0건</div></div></div>
<div class="flex justify-between items-center"><h2 class="font-bold text-base">📋 실시간 주문 리스트</h2><div class="flex gap-2"><button onclick="enableTTS()" id="tts_btn" class="text-xs bg-indigo-600 text-white px-2.5 py-1.5 rounded-lg">🔊 음성알림</button><button onclick="clearOrders()" class="text-xs text-red-600 border px-3 py-1.5 rounded-lg">전체 초기화</button></div></div>
<div id="order_list_container" class="space-y-3"></div><div id="empty_notice" class="bg-white rounded-xl p-8 text-center border text-slate-400 text-sm hidden">아직 접수된 주문이 없습니다.</div></div>
</main>
<script>
const firebaseConfig={apiKey:"AIzaSyApTZXjW03-8Z2AMh8uOksT7LzM-hwX39I",authDomain:"oneul-hankki.firebaseapp.com",databaseURL:"https://oneul-hankki-default-rtdb.firebaseio.com",projectId:"oneul-hankki",storageBucket:"oneul-hankki.firebasestorage.app",messagingSenderId:"512249280108",appId:"1:512249280108:web:8ba0d79e819c7ec43c0a49"};
firebase.initializeApp(firebaseConfig);const db=firebase.database(),auth=firebase.auth();let currentOrders=[],tts=false,previousCount=null;
function isAdminUser(user){return !!(user&&user.email);} 
async function loginAdmin(){const email=document.getElementById('admin_email').value.trim(),pw=document.getElementById('admin_password').value;if(!email||!pw){return showLoginMsg('이메일과 비밀번호를 입력하세요.')}try{const r=await auth.signInWithEmailAndPassword(email,pw);const snap=await db.ref('admins/'+r.user.uid).once('value');if(snap.val()!==true){await auth.signOut();return showLoginMsg('관리자 권한이 등록되지 않은 계정입니다.')}showDashboard();}catch(e){showLoginMsg('로그인 실패: '+e.message)}}
function showLoginMsg(t){document.getElementById('login_msg').innerText=t}
function showDashboard(){document.getElementById('login_box').classList.add('hidden');document.getElementById('dashboard').classList.remove('hidden');initRealtimeOrders()}
function logoutAdmin(){auth.signOut().then(()=>location.reload())}
auth.onAuthStateChanged(async user=>{if(!user)return;try{const s=await db.ref('admins/'+user.uid).once('value');if(s.val()===true)showDashboard();else await auth.signOut()}catch(e){await auth.signOut()}});
function enableTTS(){tts=true;playTTS('주문 음성 알림이 활성화되었습니다.');document.getElementById('tts_btn').innerText='🔊 알림 켜짐'}
function playTTS(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';speechSynthesis.speak(u)}
function parseSafeDate(x){const d=new Date(String(x||'').replace(/-/g,'/'));return isNaN(d)?new Date(0):d}
function initRealtimeOrders(){db.ref('store_orders').on('value',snap=>{const data=snap.val();currentOrders=data?Object.keys(data).map(k=>({firebaseKey:k,...data[k]})):[];currentOrders.sort((a,b)=>parseSafeDate(b.date)-parseSafeDate(a.date));if(previousCount!==null&&currentOrders.length>previousCount&&tts)playTTS('새로운 주문이 들어왔습니다.');previousCount=currentOrders.length;renderOrders()},err=>alert('주문 조회 권한 오류: '+err.message))}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function renderOrders(){const c=document.getElementById('order_list_container'),empty=document.getElementById('empty_notice');document.getElementById('total_orders_count').innerText=currentOrders.length+'건';document.getElementById('pending_orders_count').innerText=currentOrders.filter(o=>o.status==='입금대기').length+'건';if(!currentOrders.length){c.innerHTML='';empty.classList.remove('hidden');return}empty.classList.add('hidden');c.innerHTML=currentOrders.map((o,i)=>{let product=o.items&&Array.isArray(o.items)?o.items.map(x=>`<div>[${esc(x.category||'상품')}] ${esc(x.name)} (${Number(x.qty||1)}개)</div>`).join(''):esc(o.product||'상품 내역 없음').replace(/\n/g,'<br>');return `<div class="bg-white rounded-xl shadow-sm p-4 border space-y-3"><div class="flex justify-between border-b pb-2"><div><span class="text-xs font-bold text-indigo-600">${esc(o.orderId||'ORD')}</span><span class="text-xs text-slate-400 ml-2">${esc(o.date||'')}</span></div><select onchange="updateStatus(${i},this.value)" class="text-xs font-bold border rounded p-1"><option ${o.status==='입금대기'?'selected':''}>입금대기</option><option ${o.status==='입금완료'?'selected':''}>입금완료</option><option ${o.status==='배송준비'?'selected':''}>배송준비</option><option ${o.status==='배송중'?'selected':''}>배송중</option><option ${o.status==='배송완료'?'selected':''}>배송완료</option></select></div><div class="bg-slate-50 rounded-lg p-3 text-xs space-y-1"><div class="font-bold">${product}</div><div>결제금액: <b class="text-emerald-600">${Number(o.price||0).toLocaleString()}원</b></div><div>주문자: ${esc(o.name)} (${esc(o.phone)})</div><div>입금자: <b class="text-red-500">${esc(o.depositor||o.name)}</b></div><div>주소: ${esc(o.address)}</div>${o.memo?`<div>메모: ${esc(o.memo)}</div>`:''}</div><div class="text-right"><button onclick="deleteOrder(${i})" class="text-xs text-red-500">삭제</button></div></div>`}).join('')}
async function updateStatus(i,status){const o=currentOrders[i];if(!o?.firebaseKey)return;try{const updates={};updates['store_orders/'+o.firebaseKey+'/status']=status;if(o.phoneSearch){updates['guest_order_lookup/'+o.phoneSearch+'/'+o.firebaseKey+'/status']=status}await db.ref().update(updates)}catch(e){alert('상태 변경 실패: '+e.message)}}
async function deleteOrder(i){if(!confirm('해당 주문을 삭제하시겠습니까?'))return;const o=currentOrders[i];if(!o?.firebaseKey)return;try{const updates={};updates['store_orders/'+o.firebaseKey]=null;if(o.phoneSearch){updates['guest_order_lookup/'+o.phoneSearch+'/'+o.firebaseKey]=null}await db.ref().update(updates)}catch(e){alert('삭제 실패: '+e.message)}}
async function clearOrders(){if(!confirm('모든 주문 내역을 초기화하시겠습니까?'))return;try{await db.ref('store_orders').remove();await db.ref('guest_order_lookup').remove()}catch(e){alert('초기화 실패: '+e.message)}}
</script></body></html>
