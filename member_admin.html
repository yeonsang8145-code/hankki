<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>회원관리 - 오늘한끼냉동</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-functions-compat.js"></script>
<style>body{background:#f1f5f9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}.modal{background:rgba(15,23,42,.55)}</style>
</head>
<body class="text-slate-800 antialiased pb-16">
<header class="bg-slate-900 text-white py-4 px-4 shadow-md sticky top-0 z-50">
  <div class="max-w-5xl mx-auto flex justify-between items-center gap-2 flex-wrap">
    <h1 class="text-base font-bold">👥 연상네트웍스 회원 관리</h1>
    <div class="flex gap-2 flex-wrap justify-end">
      <a href="admin_firebase.html" class="text-xs bg-slate-700 px-3 py-1.5 rounded-lg">주문관리</a>
      <a href="product_editor.html" class="text-xs bg-indigo-700 px-3 py-1.5 rounded-lg">상품관리</a>
      <button onclick="logoutAdmin()" class="text-xs bg-red-700 px-3 py-1.5 rounded-lg">로그아웃</button>
    </div>
  </div>
</header>
<main class="max-w-5xl mx-auto p-4 mt-2 space-y-4">
  <div id="login_box" class="bg-white rounded-2xl shadow-sm border p-5 space-y-3 max-w-xl mx-auto">
    <h2 class="font-bold">🔐 관리자 로그인</h2>
    <p class="text-xs text-slate-500">Firebase Authentication에 등록되고 /admins/{UID}=true로 지정된 관리자만 이용할 수 있습니다.</p>
    <input id="admin_email" type="email" placeholder="관리자 이메일" class="w-full border rounded-xl p-3 text-sm">
    <input id="admin_password" type="password" placeholder="관리자 비밀번호" class="w-full border rounded-xl p-3 text-sm">
    <button onclick="loginAdmin()" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl">로그인</button>
    <div id="login_msg" class="text-xs text-red-500"></div>
  </div>

  <section id="member_panel" class="hidden space-y-4">
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
      <div class="bg-white p-4 rounded-xl shadow-sm border"><span class="text-xs text-slate-500">전체 회원</span><div id="member_count" class="text-2xl font-bold mt-1">0명</div></div>
      <div class="bg-white p-4 rounded-xl shadow-sm border"><span class="text-xs text-slate-500">주문 회원</span><div id="ordering_member_count" class="text-2xl font-bold text-emerald-600 mt-1">0명</div></div>
      <div class="bg-white p-4 rounded-xl shadow-sm border"><span class="text-xs text-slate-500">VIP</span><div id="vip_count" class="text-2xl font-bold text-amber-600 mt-1">0명</div></div>
      <div class="bg-white p-4 rounded-xl shadow-sm border"><span class="text-xs text-slate-500">탈퇴 처리</span><div id="withdrawn_count" class="text-2xl font-bold text-red-600 mt-1">0명</div></div>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border p-4 space-y-3">
      <div class="grid grid-cols-1 md:grid-cols-4 gap-2">
        <input id="member_search" oninput="renderMembers()" class="md:col-span-2 border rounded-xl p-3 text-sm" placeholder="이름, 이메일, 전화번호, UID 검색">
        <select id="grade_filter" onchange="renderMembers()" class="border rounded-xl p-3 text-sm">
          <option value="">전체 등급</option><option>일반회원</option><option>우수회원</option><option>VIP</option><option>사업자회원</option><option>휴면회원</option><option>탈퇴회원</option>
        </select>
        <select id="sort_select" onchange="renderMembers()" class="border rounded-xl p-3 text-sm">
          <option value="newest">가입일 최신순</option><option value="oldest">가입일 오래된순</option><option value="name">이름순</option><option value="orders">주문 많은순</option><option value="grade">등급순</option>
        </select>
      </div>
      <div class="flex justify-end"><button onclick="loadMembers()" class="bg-slate-800 text-white px-4 py-2 rounded-xl text-sm font-bold">새로고침</button></div>
    </div>

    <div id="member_list" class="grid grid-cols-1 lg:grid-cols-2 gap-3"></div>
    <div id="empty_notice" class="hidden bg-white rounded-xl p-8 text-center border text-slate-400 text-sm">조건에 맞는 회원이 없습니다.</div>
  </section>
</main>

<div id="order_modal" class="modal fixed inset-0 z-[100] hidden items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-hidden">
    <div class="p-4 border-b flex justify-between items-center"><div><h3 id="order_modal_title" class="font-bold">회원 주문내역</h3><p id="order_modal_sub" class="text-xs text-slate-500 mt-1"></p></div><button onclick="closeOrderModal()" class="text-slate-500 text-xl">×</button></div>
    <div id="member_order_list" class="p-4 space-y-3 overflow-y-auto max-h-[72vh]"></div>
  </div>
</div>

<div id="edit_modal" class="modal fixed inset-0 z-[110] hidden items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-5 space-y-3">
    <div class="flex justify-between"><h3 class="font-bold">회원정보 수정</h3><button onclick="closeEditModal()" class="text-slate-500 text-xl">×</button></div>
    <input id="edit_uid" type="hidden"><label class="text-xs font-bold">이름</label><input id="edit_name" class="w-full border rounded-xl p-3 text-sm">
    <label class="text-xs font-bold">전화번호</label><input id="edit_phone" class="w-full border rounded-xl p-3 text-sm">
    <label class="text-xs font-bold">배송 주소</label><textarea id="edit_address" class="w-full border rounded-xl p-3 text-sm" rows="3"></textarea>
    <label class="text-xs font-bold">회원 등급</label><select id="edit_grade" class="w-full border rounded-xl p-3 text-sm"><option>일반회원</option><option>우수회원</option><option>VIP</option><option>사업자회원</option><option>휴면회원</option><option>탈퇴회원</option></select>
    <button onclick="saveMemberEdit()" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl">저장</button>
  </div>
</div>

<script>
const firebaseConfig={apiKey:"AIzaSyApTZXjW03-8Z2AMh8uOksT7LzM-hwX39I",authDomain:"oneul-hankki.firebaseapp.com",databaseURL:"https://oneul-hankki-default-rtdb.firebaseio.com",projectId:"oneul-hankki",storageBucket:"oneul-hankki.firebasestorage.app",messagingSenderId:"512249280108",appId:"1:512249280108:web:8ba0d79e819c7ec43c0a49"};
firebase.initializeApp(firebaseConfig);const db=firebase.database(),auth=firebase.auth(),functions=firebase.functions();
let members=[],orders=[]; const gradeRank={"VIP":1,"사업자회원":2,"우수회원":3,"일반회원":4,"휴면회원":5,"탈퇴회원":6};
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function showLoginMsg(t){document.getElementById('login_msg').innerText=t}
async function isAdmin(user){if(!user||user.isAnonymous)return false;const s=await db.ref('admins/'+user.uid).once('value');return s.val()===true}
async function loginAdmin(){const e=document.getElementById('admin_email').value.trim(),p=document.getElementById('admin_password').value;if(!e||!p)return showLoginMsg('이메일과 비밀번호를 입력하세요.');try{const r=await auth.signInWithEmailAndPassword(e,p);if(!(await isAdmin(r.user))){await auth.signOut();return showLoginMsg('관리자 권한이 등록되지 않은 계정입니다.')}showPanel()}catch(x){showLoginMsg('로그인 실패: '+(x.message||x))}}
async function showPanel(){document.getElementById('login_box').classList.add('hidden');document.getElementById('member_panel').classList.remove('hidden');await loadMembers()}
async function loadMembers(){try{if(!(await isAdmin(auth.currentUser)))throw new Error('관리자 권한이 없습니다.');const [ms,os]=await Promise.all([db.ref('users').once('value'),db.ref('store_orders').once('value')]);const md=ms.val()||{},od=os.val()||{};members=Object.keys(md).map(uid=>({uid,...(md[uid]||{})}));orders=Object.keys(od).map(k=>({firebaseKey:k,...(od[k]||{})}));document.getElementById('member_count').innerText=members.length+'명';document.getElementById('vip_count').innerText=members.filter(m=>m.grade==='VIP').length+'명';document.getElementById('withdrawn_count').innerText=members.filter(m=>m.status==='withdrawn'||m.grade==='탈퇴회원').length+'명';const ordered=new Set(orders.filter(o=>o.ownerUid&&members.some(m=>m.uid===o.ownerUid)).map(o=>o.ownerUid));document.getElementById('ordering_member_count').innerText=ordered.size+'명';renderMembers()}catch(e){alert('회원 정보 조회 실패: '+(e.message||e))}}
function orderCount(uid){return orders.filter(o=>o.ownerUid===uid).length}
function renderMembers(){const c=document.getElementById('member_list'),empty=document.getElementById('empty_notice');const q=document.getElementById('member_search').value.trim().toLowerCase(),gf=document.getElementById('grade_filter').value,sort=document.getElementById('sort_select').value;let list=members.filter(m=>{const text=[m.name,m.email,m.phone,m.uid].map(v=>String(v||'').toLowerCase()).join(' ');return(!q||text.includes(q))&&(!gf||String(m.grade||'일반회원')===gf)});list.sort((a,b)=>{if(sort==='name')return String(a.name||'').localeCompare(String(b.name||''),'ko');if(sort==='orders')return orderCount(b.uid)-orderCount(a.uid);if(sort==='grade')return (gradeRank[a.grade||'일반회원']||99)-(gradeRank[b.grade||'일반회원']||99);const aa=String(a.createdAt||''),bb=String(b.createdAt||'');return sort==='oldest'?aa.localeCompare(bb):bb.localeCompare(aa)});if(!list.length){c.innerHTML='';empty.classList.remove('hidden');return}empty.classList.add('hidden');c.innerHTML=list.map(m=>{const oc=orderCount(m.uid),grade=m.grade||'일반회원',withdrawn=m.status==='withdrawn'||grade==='탈퇴회원';return `<div class="bg-white rounded-2xl shadow-sm border p-4 space-y-3 ${withdrawn?'opacity-70':''}"><div class="flex justify-between gap-3"><div><div class="font-bold">${esc(m.name||'(이름 없음)')} <span class="text-[11px] px-2 py-1 rounded-lg bg-indigo-50 text-indigo-700">${esc(grade)}</span></div><div class="text-xs text-slate-500 mt-1">${esc(m.email||'이메일 없음')}</div></div><span class="text-xs bg-emerald-50 text-emerald-700 px-2 py-1 rounded-lg h-fit">주문 ${oc}건</span></div><div class="grid grid-cols-2 gap-2 text-xs bg-slate-50 rounded-xl p-3"><div><b>전화번호</b><br>${esc(m.phone||'-')}</div><div><b>가입일</b><br>${esc(m.createdAt||'-')}</div><div class="col-span-2"><b>주소</b><br>${esc(m.address||'-')}</div></div><div class="flex gap-2"><button onclick="openOrders(${JSON.stringify(m.uid)})" class="flex-1 bg-emerald-600 text-white py-2 rounded-xl text-sm font-bold">주문내역</button><button onclick="editMember(${JSON.stringify(m.uid)})" class="flex-1 bg-indigo-600 text-white py-2 rounded-xl text-sm font-bold">정보/등급</button></div><div class="flex gap-2"><button onclick="withdrawMember(${JSON.stringify(m.uid)})" class="flex-1 border border-amber-300 text-amber-700 py-2 rounded-xl text-sm">${withdrawn?'탈퇴 처리됨':'회원 탈퇴 처리'}</button><button onclick="deleteAuthAccount(${JSON.stringify(m.uid)})" class="flex-1 border border-red-300 text-red-600 py-2 rounded-xl text-sm">Auth 계정 삭제</button></div></div>`}).join('')}
function openOrders(uid){const m=members.find(x=>x.uid===uid);const list=orders.filter(o=>o.ownerUid===uid).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));document.getElementById('order_modal_title').innerText=(m?.name||m?.email||'회원')+' 주문내역';document.getElementById('order_modal_sub').innerText=`총 ${list.length}건 · ${m?.email||''}`;document.getElementById('member_order_list').innerHTML=list.length?list.map(o=>`<div class="border rounded-xl p-3 text-sm space-y-1"><div class="flex justify-between"><b class="text-indigo-600">${esc(o.orderId||'ORD')}</b><span class="text-xs text-slate-400">${esc(o.date||'')}</span></div><div class="font-semibold whitespace-pre-line">${esc(o.product||'상품 내역 없음')}</div><div>결제금액: <b class="text-emerald-600">${Number(o.price||0).toLocaleString()}원</b></div><div>상태: <b>${esc(o.status||'')}</b></div><div class="text-xs text-slate-500">${esc(o.phone||'')} · ${esc(o.address||'')}</div></div>`).join(''):'<div class="text-center py-10 text-slate-400">주문내역이 없습니다.</div>';document.getElementById('order_modal').classList.remove('hidden');document.getElementById('order_modal').classList.add('flex')}
function closeOrderModal(){document.getElementById('order_modal').classList.add('hidden');document.getElementById('order_modal').classList.remove('flex')}
function editMember(uid){const m=members.find(x=>x.uid===uid);if(!m)return;document.getElementById('edit_uid').value=uid;document.getElementById('edit_name').value=m.name||'';document.getElementById('edit_phone').value=m.phone||'';document.getElementById('edit_address').value=m.address||'';document.getElementById('edit_grade').value=m.grade||'일반회원';document.getElementById('edit_modal').classList.remove('hidden');document.getElementById('edit_modal').classList.add('flex')}
function closeEditModal(){document.getElementById('edit_modal').classList.add('hidden');document.getElementById('edit_modal').classList.remove('flex')}
async function saveMemberEdit(){const uid=document.getElementById('edit_uid').value,name=document.getElementById('edit_name').value.trim(),phone=document.getElementById('edit_phone').value.trim(),address=document.getElementById('edit_address').value.trim(),grade=document.getElementById('edit_grade').value;if(!name||!phone)return alert('이름과 전화번호를 입력해주세요.');try{await db.ref('users/'+uid).update({name,phone,address,grade,status:grade==='탈퇴회원'?'withdrawn':'active'});closeEditModal();await loadMembers();alert('회원정보와 등급이 수정되었습니다.')}catch(e){alert('수정 실패: '+(e.message||e))}}
async function withdrawMember(uid){const m=members.find(x=>x.uid===uid);if(!m)return;if(m.status==='withdrawn')return alert('이미 탈퇴 처리된 회원입니다.');if(!confirm(`${m.name||m.email||'회원'}을 탈퇴 처리하시겠습니까?\n\n회원 프로필은 탈퇴 상태로 변경되며 주문 기록은 관리자 보관을 위해 유지됩니다.`))return;try{await db.ref('users/'+uid).update({status:'withdrawn',grade:'탈퇴회원',withdrawnAt:new Date().toISOString()});await loadMembers();alert('회원 탈퇴 처리가 완료되었습니다.')}catch(e){alert('탈퇴 처리 실패: '+(e.message||e))}}
async function deleteAuthAccount(uid){const m=members.find(x=>x.uid===uid);if(!m)return;if(uid===auth.currentUser?.uid)return alert('현재 로그인한 관리자 계정은 삭제할 수 없습니다.');if(!confirm(`${m.name||m.email||'회원'}의 Firebase Authentication 계정을 삭제하시겠습니까?\n\n삭제 후에는 해당 회원이 이메일/비밀번호로 다시 로그인할 수 없습니다. 주문 기록은 관리자 보관을 위해 유지됩니다.`))return;try{const fn=functions.httpsCallable('adminDeleteUser');const result=await fn({uid});alert(result?.data?.message||'Authentication 계정이 삭제되었습니다.');await loadMembers()}catch(e){alert('Auth 계정 삭제에 실패했습니다.\n\nCloud Functions의 adminDeleteUser가 배포되어 있어야 합니다.\n\n'+(e.message||e))}}
function logoutAdmin(){auth.signOut().then(()=>location.href='admin_firebase.html')}
auth.onAuthStateChanged(async user=>{if(!user)return;try{if(await isAdmin(user))showPanel();else await auth.signOut()}catch(e){await auth.signOut()}});
</script>
</body></html>
